.toolbar{display:flex;gap:7px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);overflow:auto}.toolbar button,.toolbar input,.back{min-height:44px;border:1px solid var(--line);background:var(--paper);padding:7px 10px;text-decoration:none}.toolbar button{cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible,.back:hover{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}#search{width:260px}.spacer{flex:1}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,34vw);min-height:0}.map-wrap{position:relative;overflow:auto;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-color:color-mix(in srgb,var(--paper) 93%,var(--bg));cursor:grab}.map-wrap.dragging{cursor:grabbing;user-select:none}svg{display:block;min-width:100%;min-height:100%}.edge{fill:none;stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--accent);stroke-width:3}.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.node.branch rect{fill:var(--soft);stroke:var(--accent)}.node.root rect{fill:var(--accent);stroke:var(--accent)}.node.root text{fill:white}.node text{fill:var(--ink);font-family:DBHeavent,sans-serif;font-size:17px;pointer-events:none}.node .small{font-size:13px;fill:var(--muted)}.node.root .small{fill:#fff;opacity:.82}.node{cursor:pointer}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3}.node.match rect{stroke:#d18a15;stroke-width:4}.node.done rect{stroke:var(--done)}.node .status{fill:var(--done)}
.inspector{border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}.crumb{color:var(--muted);font-size:15px;margin-bottom:5px}.inspector h2{font-size:28px;line-height:1.12;margin:0 0 9px}.inspect-actions{display:flex;gap:6px;margin:9px 0 15px}.inspect-actions button{border:1px solid var(--line);background:var(--paper);min-height:44px;padding:7px 10px;cursor:pointer}.detail h1,.detail h2,.detail h3{font-size:22px}.detail h4{font-size:20px}.detail p{margin:6px 0 11px}.detail ul,.detail ol{padding-left:23px}.detail li{margin:3px 0}.detail blockquote{margin:10px 0;padding:8px 11px;background:var(--soft);border:1px solid var(--accent)}code{background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:1px 4px;font:14px ui-monospace,SFMono-Regular,monospace}pre{overflow:auto;white-space:pre-wrap;background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace}table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:9px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;min-width:80px}th{background:var(--soft)}.empty{color:var(--muted)}
.legend{position:sticky;left:10px;bottom:10px;display:inline-flex;gap:10px;background:var(--paper);border:1px solid var(--line);padding:6px 9px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:var(--accent)}.dot.done{background:var(--done)}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100%}header{align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr;grid-template-rows:62vh auto}.inspector{border-left:0;border-top:2px solid var(--ink);min-height:45vh}.toolbar{flex-wrap:wrap}#search{width:100%;order:3}.spacer{display:none}}
@media print{body{overflow:visible}.app{display:block}.toolbar,.legend{display:none}.workspace{display:block}.map-wrap{height:70vh;border-bottom:2px solid #000}.inspector{border:0}.inspect-actions{display:none}}
</style></head><body><div class="app"><header><div><h1>EGCO623 · Data Mining &amp; Machine Learning</h1><p>Mind Map จาก Slack หลังเรียนจริง — คลิกกิ่งเพื่ออ่านรายละเอียด</p></div><span class="badge">8 สรุปคาบจริง</span></header><nav class="toolbar"><a class="back" href="index.html">← ทุกวิชา</a><button id="expand">ขยายทั้งหมด</button><button id="collapse">ย่อทั้งหมด</button><button id="zin" aria-label="ซูมเข้า">＋</button><button id="zout" aria-label="ซูมออก">−</button><button id="reset">รีเซ็ต</button><input id="search" type="search" placeholder="ค้นหาในวิชา"><span id="searchStatus"></span><span class="spacer"></span><span id="visibleCount"></span><button id="theme" aria-label="สลับโหมดสี">◐</button><button onclick="window.print()">พิมพ์/PDF</button></nav><div class="workspace"><div id="mapWrap" class="map-wrap"><svg id="map" aria-label="แผนผัง EGCO623"></svg><div class="legend"><span><i class="dot"></i>กิ่งหลัก</span><span><i class="dot done"></i>อ่านแล้ว</span></div></div><aside class="inspector"><div id="crumb" class="crumb"></div><h2 id="detailTitle"></h2><div class="inspect-actions"><button id="doneBtn">ทำเครื่องหมายว่าอ่านแล้ว</button></div><div id="detail" class="detail"></div></aside></div></div><script>
const TREE={"id": "root", "label": "EGCO623", "subtitle": "Data Mining & Machine Learning", "level": 0, "body": "<p><strong>EGCO623 — Data Mining &amp; Machine Learning<\/strong><\/p><p>คลิกกิ่งเพื่อเปิดรายละเอียด แล้วกดอีกครั้งเพื่อย่อหรือขยาย<\/p>", "children": [{"id": "n1", "label": "Week 1: Data Mining, KDD, Analytics และจริยธรรม", "level": 1, "children": [{"id": "n2", "label": "A1. Data Mining และลำดับการเปลี่ยนข้อมูลเป็นความรู้", "level": 2, "children": [], "body": "<ul>\n<li>Data Mining คือการหาแบบแผนหรือสิ่งที่มีประโยชน์จากข้อมูลจำนวนมาก เช่น ข้อมูลเซ็นเซอร์ บัตรเครดิต และแอป<\/li>\n<li>ลำดับความรู้:<\/li>\n<li><code>Data → Information → Knowledge → Wisdom<\/code><\/li>\n<li>ตัวอย่างในข้อความ:<\/li>\n<li>รหัสไฟแดง <code>192.3.45<\/code> = Data<\/li>\n<li>“ไฟแดงหน้ามอ ถนนพีช” = Information<\/li>\n<li>รู้ว่าช่วงนี้รถติด = Knowledge<\/li>\n<li>ตัดสินใจว่าจะออกเวลาไหน = Wisdom<\/li>\n<\/ul>"}, {"id": "n3", "label": "A2. KDD Process", "level": 2, "children": [], "body": "<p>ทำเป็น flow diagram:<\/p>\n<p><code>ข้อมูลดิบ → Pre-Processing → Data Mining → Post-Process → ความรู้ที่ใช้ได้<\/code><\/p>"}, {"id": "n4", "label": "A3. ประเภทงานวิเคราะห์", "level": 2, "children": [], "body": "<ul>\n<li><strong>Classification:<\/strong> ทำนายป้ายกำกับ เช่น ลูกค้าจะย้ายค่ายหรือไม่ และการอนุมัติสินเชื่อ<\/li>\n<li><strong>Regression:<\/strong> ทำนายตัวเลข เช่น ยอดขายสินค้าใหม่ ราคาหุ้น หรือความเร็วลมจากอุณหภูมิ/ความชื้น/ฝน<\/li>\n<li><strong>Clustering:<\/strong> จัดกลุ่มข้อมูลที่คล้ายกันโดยไม่มีป้ายกลุ่มล่วงหน้า เช่น แบ่งกลุ่มลูกค้าจากพฤติกรรมซื้อ<\/li>\n<li><strong>Anomaly Detection:<\/strong> หาจุดผิดปกติ เช่น ธุรกรรมบัตรเครดิตน่าสงสัยหรือการบุกรุกเครือข่าย<\/li>\n<\/ul>"}, {"id": "n5", "label": "A4. Machine Learning และเครื่องมือ", "level": 2, "children": [], "body": "<ul>\n<li>Supervised vs Unsupervised เป็นแกนแนวคิดของสัปดาห์แรก<\/li>\n<li>รายชื่ออัลกอริทึมตามข้อความ: <code>Gradient Boosting → Logistic Regression → Random Forest → Deep Learning → Transformers<\/code><\/li>\n<li>Enterprise tools: Databricks, AWS, Google Cloud, Microsoft Fabric, SAS<\/li>\n<li>Open source: Python (pandas, scikit-learn), TensorFlow, Apache Spark, Orange, H2O.ai<\/li>\n<li>MLOps: หลัง deploy ต้องดูแลและอัปเดตโมเดลให้ทันสถานการณ์<\/li>\n<\/ul>"}, {"id": "n6", "label": "A5. Ethics, Privacy และ Bias", "level": 2, "children": [], "body": "<p>ทำเป็น callout สำคัญ:<\/p>\n<ul>\n<li><strong>Ethics &amp; Bias:<\/strong> โมเดลอาจปฏิเสธสินเชื่อเพราะเพศหรือเชื้อชาติโดยไม่ได้ตั้งใจ<\/li>\n<li><strong>Privacy:<\/strong> ต้องถามว่าข้อมูลเป็นของใคร เก็บที่ไหน และนำไปใช้อย่างไร<\/li>\n<li>ข้อสรุปจากคำถามฝึกในข้อความ: โมเดลที่แม่นยำยังไม่เพียงพอ หากมีอคติแฝง<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S1<\/p>"}, {"id": "n7", "label": "Exploring Data", "level": 1, "children": [{"id": "n8", "label": "B1. ภาษาพื้นฐานของชุดข้อมูล", "level": 2, "children": [], "body": "<ul>\n<li><strong>Concept:<\/strong> สิ่งที่ต้องการเรียนรู้ เช่น ทำนายว่าโกงหรือไม่<\/li>\n<li><strong>Instance/Object:<\/strong> ตัวอย่างหนึ่งรายการหรือหนึ่งแถว เช่น ลูกค้าหนึ่งคน<\/li>\n<li><strong>Attribute/Feature:<\/strong> คุณสมบัติหนึ่งคอลัมน์ เช่น อายุ รายได้ สถานภาพ<\/li>\n<li>งานหลักที่ระบุในบท: Classification, Numeric Prediction, Association, Clustering<\/li>\n<\/ul>"}, {"id": "n9", "label": "B2. ชนิด Attribute", "level": 2, "children": [], "body": "<table>\n<thead>\n<tr>\n<th>ชนิด<\/th>\n<th>สิ่งที่ทำได้<\/th>\n<th>ตัวอย่างจากข้อความ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nominal<\/td>\n<td>แค่ชื่อ/ประเภท ไม่มีลำดับ<\/td>\n<td>กรุ๊ปเลือด สีตา รหัสไปรษณีย์<\/td>\n<\/tr>\n<tr>\n<td>Ordinal<\/td>\n<td>เรียงลำดับได้ แต่ระยะไม่แน่นอน<\/td>\n<td>น้อย–กลาง–มาก, อันดับ<\/td>\n<\/tr>\n<tr>\n<td>Interval<\/td>\n<td>ผลต่างมีความหมาย แต่ไม่มีศูนย์แท้<\/td>\n<td>°C, °F, ปีปฏิทิน<\/td>\n<\/tr>\n<tr>\n<td>Ratio<\/td>\n<td>มีศูนย์แท้ เปรียบเทียบเป็นกี่เท่าได้<\/td>\n<td>น้ำหนัก ระยะทาง เวลา จำนวน<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>ข้อความช่วยจำ: <strong>ชื่อ → เรียงได้ → ลบกันได้ → หารเป็นสัดส่วนได้<\/strong><\/p>\n<p>เพิ่มเติม:<\/p>\n<ul>\n<li>Discrete: นับแยกเป็นรายการได้ เช่น จำนวนหนังสือหรือคำในเอกสาร<\/li>\n<li>Continuous: อยู่บนช่วงต่อเนื่อง เช่น ส่วนสูง น้ำหนัก อุณหภูมิ<\/li>\n<li>ตัวอย่างการใช้ชนิดข้อมูลผิด: <code>outlook &gt; sunny<\/code> ไม่มีความหมาย<\/li>\n<\/ul>"}, {"id": "n10", "label": "B3. Dataset Types", "level": 2, "children": [], "body": "<p>ทำเป็น grid 6 แบบ:<\/p>\n<ol>\n<li>Record — ตารางทั่วไป แต่ละแถวมีชุด attribute คงที่<\/li>\n<li>Data Matrix — ตัวเลขแบบ <code>m แถว × n คอลัมน์<\/code><\/li>\n<li>Document — เวกเตอร์คำและความถี่<\/li>\n<li>Transaction — ชุดสินค้า/เหตุการณ์ เช่น ตะกร้าสินค้า<\/li>\n<li>Graph — โหนดและความสัมพันธ์ เช่น เว็บหรือโมเลกุล<\/li>\n<li>Ordered — ลำดับสำคัญ เช่น time series, spatial-temporal, DNA sequence<\/li>\n<\/ol>"}, {"id": "n11", "label": "B4. Data Quality", "level": 2, "children": [], "body": "<ul>\n<li>Noise<\/li>\n<li>Outlier<\/li>\n<li>Missing value<\/li>\n<li>Inaccurate/inconsistent: พิมพ์ผิด หน่วยผิด วันที่ต่างรูปแบบ หมวดหมู่สะกดหลายแบบ<\/li>\n<li>Duplicate/stale data<\/li>\n<li>การแก้ missing ในภาพรวม: ลบแถว, ประมาณค่า, ข้ามค่านั้นระหว่างวิเคราะห์ หรือแทนค่าตามความน่าจะเป็น โดยต้องเลือกตามบริบท<\/li>\n<\/ul>"}, {"id": "n12", "label": "B5. EDA และสถิติพื้นฐาน", "level": 2, "children": [], "body": "<p>ทำเป็น glossary:<\/p>\n<ul>\n<li>Frequency / Mode<\/li>\n<li>Percentile; percentile 50 คือค่ากึ่งกลาง<\/li>\n<li>Mean — ไวต่อ outlier<\/li>\n<li>Median — ทนต่อ outlier มากกว่า mean<\/li>\n<li><code>Range = max − min<\/code><\/li>\n<li>Variance / Standard Deviation — วัดการกระจายแต่ยังไวต่อ outlier<\/li>\n<li>IQR — ช่วงระหว่าง quartile ล่างกับบน<\/li>\n<\/ul>"}, {"id": "n13", "label": "B6. Output ของการเรียนรู้", "level": 2, "children": [], "body": "<ul>\n<li>Decision table<\/li>\n<li>Decision tree<\/li>\n<li>Classification rule: <code>IF เงื่อนไข THEN ผลลัพธ์<\/code><\/li>\n<li>Instance-based learning เช่น k-nearest neighbors<\/li>\n<\/ul>"}, {"id": "n14", "label": "B7. Assignment จากสไลด์ Chapter 2", "level": 2, "children": [], "body": "<ul>\n<li>ชุด yield strength: <code>79, 85, 78, 100, 74, 83, 81, 85, 82, 80, 84<\/code><\/li>\n<li>ต้องหา sample mean, variance, standard deviation, median, quartiles, range และ IQR<\/li>\n<li>ตารางบุคคล 10 แถว: ตรวจ ID ซ้ำ วันเกิดต่างรูปแบบ ค่าหาย หมวดหมู่ผิด และข้อมูลขัดแย้ง<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S2 และส่วนทบทวนใน S5<\/p>"}, {"id": "n15", "label": "Visualization", "level": 1, "children": [{"id": "n16", "label": "C1. ทำไมต้องวาดกราฟ", "level": 2, "children": [], "body": "<ul>\n<li>ช่วยเห็น pattern, trend และ outlier เร็วกว่าตัวเลขล้วน<\/li>\n<li><strong>Representation:<\/strong> แมปข้อมูลเป็นจุด เส้น สี รูปร่าง ขนาด และตำแหน่งแกน<\/li>\n<li><strong>Arrangement:<\/strong> แค่ sort ก็อาจเผย pattern; ตัวอย่างตาราง 0/1 ที่เรียงแล้วเห็นกฎ <code>613 ↔ 254<\/code> สลับกัน<\/li>\n<li><strong>Selection:<\/strong> เลือก subset; มนุษย์รับรู้ได้ประมาณ 2–3 มิติ และกราฟ 3 มิติอาจหลอกตาจาก perspective<\/li>\n<\/ul>"}, {"id": "n17", "label": "C2. กราฟที่ต้องอ่านได้", "level": 2, "children": [], "body": "<ul>\n<li><strong>Histogram:<\/strong> 1 ตัวแปร แบ่งความถี่เป็น bin; 10 bin กับ 20 bin ทำให้รูปร่างต่างกัน<\/li>\n<li><strong>Boxplot:<\/strong> กล่องครอบ 50% ของข้อมูล; Q1, median, Q3; หนวดไปถึงค่าสุดท้ายที่ไม่เกิน <code>1.5 × IQR<\/code>; จุดเกินเป็น outlier<\/li>\n<li><strong>Scatter plot:<\/strong> แสดงข้อมูล 2 มิติ; หลาย attribute ใช้ array of scatter plots และสีแทน class<\/li>\n<li><strong>Correlation matrix:<\/strong> คำนวณ correlation ทุกคู่แล้วใช้สีแทนระดับ<\/li>\n<\/ul>"}, {"id": "n18", "label": "C3. Iris dataset", "level": 2, "children": [], "body": "<ul>\n<li>Setosa (สีน้ำเงินในตัวอย่าง) แยกง่ายที่สุด เพราะค่าต่ำและห่างจากกลุ่มอื่น<\/li>\n<li>Versicolor กับ Virginica ซ้อนกันบางส่วน จึงต้องใช้ attribute อื่นช่วย<\/li>\n<li>Petal length เพิ่มพร้อม petal width เป็นตัวอย่างความสัมพันธ์เชิงเส้น<\/li>\n<\/ul>"}, {"id": "n19", "label": "C4. เครื่องมือ", "level": 2, "children": [], "body": "<ul>\n<li>Excel / Google Sheets<\/li>\n<li>Python: pandas, matplotlib, seaborn<\/li>\n<li>R<\/li>\n<li>Tableau / Power BI<\/li>\n<\/ul>"}, {"id": "n20", "label": "C5. เฉลยงานตรวจปัญหา dataset — 11 จุด", "level": 2, "children": [], "body": "<ol>\n<li>แถว 2 มี missing<\/li>\n<li>ID <code>10596<\/code> ซ้ำสองคน ทั้งที่ ID ต้อง unique<\/li>\n<li>Birthday ผิด format<\/li>\n<li>Rome อาจสะกดผิดเป็น Roma; ต้องเทียบกับ Italy<\/li>\n<li>ปีเกิด 1948 ทำให้อายุ 78 — ตั้งข้อสังเกตว่าผิดปกติหรือไม่<\/li>\n<li>Teacher = 0 เทียบกับ Student — format ID คนละแบบ<\/li>\n<li>ชื่อ column มีเครื่องหมายคำถาม<\/li>\n<li>Ann ถูกระบุเป็นผู้ชายในแถว 17 — อาจผิดคนหรือต่อข้อมูลผิดแถว<\/li>\n<li>เพศ = A<\/li>\n<li>อาจมีชื่อบุคคลที่ไม่มีอยู่จริง<\/li>\n<li>Column name สับสน<\/li>\n<\/ol>\n<p>บทเรียน: บางปัญหาต้องดูหลาย attribute ร่วมกัน เช่น เพศ+ชื่อ และความผิดพลาดอาจเกิดตั้งแต่ merge; จดข้อสงสัยแล้วกลับไปถามเจ้าของข้อมูล<\/p>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S5 และภาพรวม EDA ใน S2<\/p>"}, {"id": "n21", "label": "Data Preprocessing", "level": 1, "children": [{"id": "n22", "label": "D1. ภาพรวม", "level": 2, "children": [], "body": "<ul>\n<li>แนวคิด GIGO: Garbage In → Garbage Out<\/li>\n<li>การเตรียมข้อมูลใช้เวลาประมาณ <strong>60% ของงาน data mining<\/strong> ตามสไลด์ที่ S3 อ้าง<\/li>\n<li>ปัญหาที่พบ: missing, outlier, stale data, หน่วยไม่ตรง, พิมพ์ผิด<\/li>\n<\/ul>"}, {"id": "n23", "label": "D2. Data Cleaning และ Missing Values", "level": 2, "children": [], "body": "<p>5 วิธีจาก S3:<\/p>\n<ol>\n<li>เติมค่าคงที่ เช่น 0 หรือ “Missing”<\/li>\n<li>เติม mode สำหรับข้อความ หรือ mean สำหรับตัวเลข<\/li>\n<li>สุ่มเติมตามสัดส่วนการกระจายเดิม<\/li>\n<li>เติมค่าเฉลี่ยของกลุ่มเดียวกัน<\/li>\n<li>ใช้โมเดล ML ทำนายค่าที่หาย<\/li>\n<\/ol>\n<p>ข้อควรระวัง:<\/p>\n<ul>\n<li>ไม่ควรลบแถวทิ้งทันที เพราะอาจทำให้ข้อมูลเบ้และเสียค่าดีในคอลัมน์อื่น<\/li>\n<li>การเติม mean โดยไม่เข้าใจ attribute อาจสร้างค่าที่ไม่สมเหตุสมผล<\/li>\n<li>ตัวอย่าง: รถ <code>150 แรงม้าแต่ 4 สูบ<\/code> เทียบกับข้อมูลจริง <code>140 hp = 8 สูบ<\/code><\/li>\n<li>Larose เตือนว่าการเติมอาจทำ confidence ให้ <strong>overoptimistic<\/strong>; ควรถาม domain expert<\/li>\n<li>Income <code>99,999<\/code> อาจเป็นรหัสแทน missing หรือ zip code <code>99999<\/code> ที่พิมพ์ผิดช่อง; ต้องถาม DB admin<\/li>\n<\/ul>\n<p>ตัวอย่างข้อมูลผิดจากสไลด์:<\/p>\n<ul>\n<li>รายได้ <code>-$40,000<\/code><\/li>\n<li>zip code <code>6269<\/code> ที่อาจต้องเป็น <code>06269<\/code><\/li>\n<li>อายุ = <code>C<\/code><\/li>\n<li>ประเทศหลายรูปแบบ: USA / US / France / Europe → ต้องทำหมวดหมู่ให้สอดคล้องกัน<\/li>\n<\/ul>"}, {"id": "n24", "label": "D3. Outlier", "level": 2, "children": [], "body": "<p>สูตร:<\/p>\n<ul>\n<li><code>Z = (X − mean) / SD<\/code><\/li>\n<li>เกณฑ์ในข้อความ: ปกติอยู่ใน <code>[-3, 3]<\/code>; เกิน <code>±3<\/code> เป็น outlier<\/li>\n<li>ตัวอย่างรถใช้ 25 วินาทีถึง 60 mph มี <code>Z = 3.247<\/code> → outlier<\/li>\n<li>Six Sigma ใน S6: 99.7% อยู่ใน <code>[-3, 3]<\/code>; 68% อยู่ใน <code>[-1, 1]<\/code><\/li>\n<li>จุดอ่อน: mean และ SD ถูก outlier ดึง; เมื่อตัด outlier แล้วคำนวณใหม่ อาจพบ outlier ชุดใหม่<\/li>\n<\/ul>\n<p>IQR:<\/p>\n<ul>\n<li><code>IQR = Q3 − Q1<\/code><\/li>\n<li>outlier เมื่อ <code>&lt; Q1 − 1.5 × IQR<\/code> หรือ <code>&gt; Q3 + 1.5 × IQR<\/code><\/li>\n<li>ตัวอย่าง: <code>Q1=70, Q3=80, IQR=10<\/code> → ต่ำกว่า 55 หรือสูงกว่า 95 เป็น outlier<\/li>\n<\/ul>"}, {"id": "n25", "label": "D4. Data Transformation", "level": 2, "children": [], "body": "<ul>\n<li>ถ้าคะแนน 0–100 อยู่ร่วมกับเงินเดือน 0–1,000,000 โมเดลอาจให้น้ำหนักเงินเดือนมากเพราะสเกลใหญ่กว่า<\/li>\n<li>Min-Max normalization:<\/li>\n<li><code>X_new = (X − Min) / (Max − Min)<\/code><\/li>\n<li>ผลอยู่ใน <code>[0,1]<\/code><\/li>\n<li>ตัวอย่างค่า 14 ในช่วง <code>[8,26]<\/code>: <code>(14−8)/(26−8) ≈ 0.33<\/code><\/li>\n<li>Z-score standardization:<\/li>\n<li><code>X_new = (X − mean) / SD<\/code><\/li>\n<li>mean ใหม่เป็น 0; ต่ำกว่า mean เป็นลบ สูงกว่า mean เป็นบวก; ในข้อความระบุช่วงโดยประมาณ <code>[-4,4]<\/code><\/li>\n<\/ul>"}, {"id": "n26", "label": "D5. Data Integration", "level": 2, "children": [], "body": "<ul>\n<li>format ต่างกัน<\/li>\n<li>เวลาอ้างอิงต่างกัน<\/li>\n<li>key ต่างกันหรือ key ซ้ำ<\/li>\n<li>ระดับการสรุปรวมต่างกัน<\/li>\n<li>ข้อผิดพลาดเดิมของแต่ละแหล่ง<\/li>\n<li>merge ผิดแถวทำให้ข้อมูลขัดกัน เช่น ชื่อกับเพศ<\/li>\n<\/ul>"}, {"id": "n27", "label": "D6. Data Reduction และ Aggregation", "level": 2, "children": [], "body": "<ul>\n<li>Aggregation: ฝนรายเดือน → รายปี ช่วยให้แนวโน้มชัดขึ้น ข้อมูล stable ขึ้นและลดปริมาณข้อมูล<\/li>\n<li>ตัวอย่างรวม attribute: ส่วนสูง + น้ำหนัก → BMI<\/li>\n<li>Reduction แบ่งต่อเป็น Sampling, Feature Selection และ Feature Extraction ใน section ถัดไป<\/li>\n<\/ul>"}, {"id": "n28", "label": "D7. Discretization", "level": 2, "children": [], "body": "<p>3 แบบตาม S6:<\/p>\n<ol>\n<li>ช่วงเท่ากัน — นิยมเพราะง่าย<\/li>\n<li>ความถี่เท่ากัน<\/li>\n<li>k-means — ได้ช่วงที่เหมาะกับกลุ่ม แต่ต้องรัน clustering ก่อน<\/li>\n<\/ol>\n<p>ตัวอย่างการใช้ใน Data Cube: แบ่ง petal length/width ของ Iris เป็น low/medium/high ก่อนนำไปนับใน cube<\/p>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S3, S4, S6 และประเด็นการรวมหลายแหล่งใน S2<\/p>"}, {"id": "n29", "label": "Sampling, Correlation และ Dimensionality Reduction", "level": 1, "children": [{"id": "n30", "label": "E1. Sampling", "level": 2, "children": [], "body": "<ul>\n<li>ถ้า sample เป็นตัวแทนที่ดี ผลอาจใกล้เคียงการใช้ข้อมูลทั้งหมด<\/li>\n<li>Simple random<\/li>\n<li>Without replacement<\/li>\n<li>With replacement<\/li>\n<li>Stratified sampling: แบ่งกลุ่มแล้วสุ่มจากทุกกลุ่ม<\/li>\n<\/ul>\n<p>ตัวเลขตัวอย่าง:<\/p>\n<ul>\n<li>ผู้หญิง 50 : ผู้ชาย 500 = <code>1:10<\/code><\/li>\n<li>หากสุ่ม 100 คนแบบรักษาสัดส่วน ควรได้หญิง 9 : ชาย 91<\/li>\n<li>ถ้ามี 10 กลุ่ม: sample 20 มีโอกาสครบทุกกลุ่ม <code>0.2<\/code>; sample 40 = <code>0.85<\/code>; sample 60 ≈ <code>0.9<\/code><\/li>\n<\/ul>"}, {"id": "n31", "label": "E2. Curse of Dimensionality", "level": 2, "children": [], "body": "<ul>\n<li>เมื่อฟีเจอร์มาก ข้อมูลจะเบาบาง<\/li>\n<li>ระยะทางและความหนาแน่นมีความหมายน้อยลง จึงกระทบ clustering และ outlier detection<\/li>\n<\/ul>"}, {"id": "n32", "label": "E3. Feature Selection", "level": 2, "children": [], "body": "<p>ตัดฟีเจอร์เดิมที่:<\/p>\n<ul>\n<li>ซ้ำซ้อน เช่น ราคาสินค้ากับภาษี<\/li>\n<li>ไม่เกี่ยว เช่น รหัสนักศึกษากับการทำนายเกรด<\/li>\n<\/ul>\n<p>วิธีคัด:<\/p>\n<ul>\n<li>Brute-force<\/li>\n<li>Filter<\/li>\n<li>Wrapper<\/li>\n<li>Embedded<\/li>\n<\/ul>\n<p>ตัวอย่างราคาบ้าน:<\/p>\n<ul>\n<li>Useful: จำนวนห้องนอน, ขนาดตารางเมตร, ระยะเข้าเมือง<\/li>\n<li>Irrelevant ตามโจทย์: สีบ้าน, Random ID<\/li>\n<\/ul>"}, {"id": "n33", "label": "E4. Feature Extraction", "level": 2, "children": [], "body": "<ul>\n<li><strong>PCA:<\/strong> หาแกนใหม่ที่เก็บ variance สูงสุด; unsupervised<\/li>\n<li>ขั้นตอน: <code>standardize → covariance matrix → eigen decomposition → เลือกแกน → project<\/code><\/li>\n<li><strong>LDA:<\/strong> หาแกนที่แยก class ออกจากกัน; supervised<\/li>\n<li>เป้าหมาย: ระยะระหว่าง class สูง และข้อมูลใน class เดียวกันกระจุก<\/li>\n<li>t-SNE / UMAP: ใช้แสดงข้อมูล 2D/3D<\/li>\n<li>Autoencoder: neural network สำหรับบีบข้อมูล<\/li>\n<li>แนวคิดทำ thesis จาก S6: นำ algorithm เดิมมาเพิ่ม criteria ใหม่ เช่น เติมเงื่อนไข class จาก PCA ให้ LDA เพื่อพัฒนา algorithm ใหม่<\/li>\n<\/ul>"}, {"id": "n34", "label": "E5. Correlation", "level": 2, "children": [], "body": "<ul>\n<li>ช่วงค่า <code>−1 ถึง +1<\/code><\/li>\n<li>เครื่องหมายบอกทิศ: บวก = ไปทางเดียวกัน<\/li>\n<li>ขนาดบอกความแรง<\/li>\n<li>จุดเริ่มเบี่ยงออกจากแนวเส้นมากขึ้น ค่าสหสัมพันธ์จะลดลง<\/li>\n<\/ul>\n<p>สูตร Pearson:<\/p>\n<p><code>r = Σ(x−x̄)(y−ȳ) / √[Σ(x−x̄)² · Σ(y−ȳ)²]<\/code><\/p>\n<p>ตัวอย่างส่วนสูง–น้ำหนัก:<\/p>\n<ul>\n<li><code>(160,55), (170,65), (180,75)<\/code><\/li>\n<li>ทุกคู่เป็น <code>น้ำหนัก = ส่วนสูง − 105<\/code><\/li>\n<li>จึงได้ <code>r = +1<\/code> เป็นความสัมพันธ์เชิงบวกสมบูรณ์<\/li>\n<\/ul>\n<p>ตัวอย่างขนม–น้ำอัดลม:<\/p>\n<ul>\n<li>ทั้งสองคอลัมน์เพิ่มพร้อมกัน และต่างกันคงที่ประมาณ 40 บาท<\/li>\n<li>เสนอ feature ใหม่: “Total Snacking Spending” หรือ “Impulse Purchase Total”<\/li>\n<li>ประโยชน์: ลด feature redundancy ทำให้โมเดลง่ายและเร็วขึ้น<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S4 และ S6<\/p>"}, {"id": "n35", "label": "Data Warehouse, Data Cube และ OLAP", "level": 1, "children": [{"id": "n36", "label": "F1. Data Warehouse", "level": 2, "children": [], "body": "<p>คุณสมบัติ 4 ข้อจาก Inmon (1990):<\/p>\n<ol>\n<li>Subject Oriented — ออกแบบตามเรื่อง เช่น ยอดขาย<\/li>\n<li>Integrated — รวมหลายแหล่งและหลาย format ให้สอดคล้องกัน<\/li>\n<li>Time Variant — ผูกข้อมูลกับช่วงเวลา<\/li>\n<li>Non-volatile — เพิ่มได้แต่ไม่ลบหรือแก้ข้อมูลเดิม<\/li>\n<\/ol>\n<p>คำศัพท์:<\/p>\n<ul>\n<li>EDW: คลังระดับทั้งองค์กร<\/li>\n<li>Data Mart: คลังย่อยของแผนก เช่น Sales หรือ HR<\/li>\n<li>DSS: ระบบช่วยผู้บริหารตัดสินใจจากข้อมูลอดีต<\/li>\n<li>OLAP: การวิเคราะห์หลายมิติใน DSS; ข้อความระบุว่าเสนอโดย E. F. Codd<\/li>\n<\/ul>"}, {"id": "n37", "label": "F2. Data Cube", "level": 2, "children": [], "body": "<ul>\n<li>มองข้อมูลหลายมิติ เช่น <code>ยอดขาย = สินค้า × ร้าน × วันที่<\/code><\/li>\n<li>ขั้นตอนสร้าง:\n  1. เลือก attribute เป็น dimension; ถ้าเป็น continuous ต้อง discretize ก่อน\n  2. เลือก target value เช่นยอดขายหรือ count ใส่ในแต่ละ cell<\/li>\n<\/ul>"}, {"id": "n38", "label": "F3. OLAP Operators", "level": 2, "children": [], "body": "<p>ทำเป็น interactive cards หรือภาพ cube:<\/p>\n<ul>\n<li>Roll-up: รายวัน → สัปดาห์/เดือน/ไตรมาส<\/li>\n<li>Drill-down: เดือน → วัน<\/li>\n<li>Slice: fix หนึ่งค่า เช่นเฉพาะวันที่ 1<\/li>\n<li>Dice: เลือก subset หลายมิติพร้อมกัน เช่น Q1+Q2, 2 สินค้า, 2 ทำเล<\/li>\n<li>Pivot, Ranking, Time functions<\/li>\n<li>ตัวอย่าง ranking: top 3% ของเมืองตามรายได้เฉลี่ย<\/li>\n<\/ul>\n<p>Hierarchy:<\/p>\n<ul>\n<li>ร้าน → Region → Country<\/li>\n<li>วัน → สัปดาห์ → Quarter<\/li>\n<li>Product → Brand → กลุ่ม<\/li>\n<\/ul>\n<p>Extended Cube:<\/p>\n<ul>\n<li>เก็บยอดรวมไว้ล่วงหน้า; ตัวเลขที่ข้อความยกคือ <code>*, 110, 19, 129<\/code><\/li>\n<\/ul>"}, {"id": "n39", "label": "F4. ตัวเลข Data Cube จากตาราง sale", "level": 2, "children": [], "body": "<p>ข้อมูลดิบ:<\/p>\n<ul>\n<li><code>p1,s1,d1=12<\/code><\/li>\n<li><code>p2,s1,d1=11<\/code><\/li>\n<li><code>p1,s3,d1=50<\/code><\/li>\n<li><code>p2,s2,d1=8<\/code><\/li>\n<li><code>p1,s1,d2=44<\/code><\/li>\n<li><code>p1,s2,d2=4<\/code><\/li>\n<\/ul>\n<p>ผลตัวอย่าง:<\/p>\n<ul>\n<li>Roll-up ข้ามวัน: <code>s1 = 12+11+44 = 67<\/code><\/li>\n<li>รวมทั้งหมด = <code>129<\/code><\/li>\n<li>Region: <code>s1=A<\/code>, <code>s2+s3=B<\/code><\/li>\n<li>p1: <code>A=56, B=54<\/code><\/li>\n<li>p2: <code>A=11, B=8<\/code><\/li>\n<\/ul>\n<p>SQL ที่ระบุในข้อความ:<\/p>\n<pre><code class=\"language-sql\">SELECT sum(amt) FROM sale WHERE date=1\n<\/code><\/pre>\n<p>ใช้เป็นตัวอย่าง slice และ <code>GROUP BY date<\/code> เป็นตัวอย่าง roll-up<\/p>"}, {"id": "n40", "label": "F5. ROLAP / MOLAP / HOLAP", "level": 2, "children": [], "body": "<table>\n<thead>\n<tr>\n<th>แบบ<\/th>\n<th>การเก็บ<\/th>\n<th>จุดเด่น/ข้อจำกัด<\/th>\n<th>ตัวอย่างงาน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ROLAP<\/td>\n<td>relational tables, RDBMS, SQL<\/td>\n<td>รองรับข้อมูลรายละเอียดจำนวนมาก<\/td>\n<td>telecom CDRs, e-commerce, บัตรเครดิต<\/td>\n<\/tr>\n<tr>\n<td>MOLAP<\/td>\n<td>multidimensional array, MDBMS, pre-calculated<\/td>\n<td>เร็วมาก เหมาะ summary <code>&lt;50GB<\/code>; ใช้พื้นที่เพิ่ม<\/td>\n<td>financial budgeting, sales analysis<\/td>\n<\/tr>\n<tr>\n<td>HOLAP<\/td>\n<td>รายละเอียดใน RDBMS + summary ใน MDBMS<\/td>\n<td>ผสมข้อดีของสองแบบ<\/td>\n<td>ยอดขายบริษัทข้ามชาติ, ธนาคาร<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>ตัวเลขจากข้อความ:<\/p>\n<ul>\n<li>MOLAP input <code>200 MB<\/code> อาจโตเป็น <code>5 GB<\/code><\/li>\n<li>ผลทดลอง: disk <code>10 vs 17 GB<\/code>; retrieve <code>240:1<\/code>; calculation <code>237:2<\/code><\/li>\n<\/ul>"}, {"id": "n41", "label": "F6. Schema ฝั่ง ROLAP", "level": 2, "children": [], "body": "<ul>\n<li>Star: fact table กลาง ลิงก์ Product/Time/Store dimensions<\/li>\n<li>Snowflake: dimension แตกต่อ เช่น Store → District → Region<\/li>\n<li>Fact Constellation: หลาย fact tables สำหรับข้อมูลซับซ้อน<\/li>\n<\/ul>"}, {"id": "n42", "label": "F7. OLTP vs OLAP", "level": 2, "children": [], "body": "<ul>\n<li>OLTP: ธุรกรรมประจำวัน เน้นเขียน/แก้ไขเร็ว ข้อมูลปัจจุบัน<\/li>\n<li>OLAP: วิเคราะห์ข้อมูลอดีต เน้นสรุป อ่านเป็นหลัก และ de-normalize<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> S7 และ S8; คำนิยาม Warehouse/Mart เบื้องต้นปรากฏใน S2<\/p>"}, {"id": "n43", "label": "Power BI Workflow", "level": 1, "children": [], "body": "<p><strong>อ้างอิง:<\/strong> S8 และหัวข้อเชื่อมจาก S7<\/p>\n<p>ทำเป็น stepper 5 ขั้น:<\/p>\n<ol>\n<li><strong>Import<\/strong> Excel จาก Classroom\n   - 2 sheets: Category 8 แถว และ Product ประมาณ 127 แถว\n   - ตรวจชนิด: Date เป็นวันที่, Sales เป็น Decimal<\/li>\n<li><strong>Model view<\/strong>\n   - ลาก CategoryID เชื่อมกัน\n   - relationship แบบ many-to-one<\/li>\n<li><strong>Visualize<\/strong>\n   - Pie: Sales by Product\n   - Line: Sales by Date\n   - Bar: Sales by Product Name\n   - Treemap และ Gauge<\/li>\n<li><strong>Slicer<\/strong>\n   - เลือก Category 1–8 แล้วทุกกราฟเปลี่ยนตาม\n   - รูปแบบปุ่ม, slider, input และ list<\/li>\n<li><strong>Measure/Aggregation<\/strong>\n   - เปลี่ยน Sum เป็น Average, Min หรือ Max<\/li>\n<\/ol>\n<hr />"}, {"id": "n44", "label": "การบ้านและประกาศ", "level": 1, "children": [{"id": "n45", "label": "H1. Chapter 2 / Data Quality", "level": 2, "children": [], "body": "<ul>\n<li>คำนวณสถิติจาก yield strength 11 ค่า<\/li>\n<li>ตรวจปัญหาคุณภาพข้อมูลในตารางบุคคล<\/li>\n<li>เฉลยในคาบรวม 11 จุด โดยยังเติมได้และตอนนั้นยังไม่ให้คะแนน<\/li>\n<\/ul>"}, {"id": "n46", "label": "H2. In-class Excel", "level": 2, "children": [], "body": "<ul>\n<li>คะแนน 0.5<\/li>\n<li>ส่วนสูง 14 คน: min 158, max 185<\/li>\n<li>เติม Normalize และ Standardize แล้วส่ง Classroom<\/li>\n<li>สูตร Excel ที่ข้อความระบุ:<\/li>\n<li><code>=AVERAGE(B2:B15)<\/code><\/li>\n<li><code>=MIN()<\/code><\/li>\n<li><code>=MAX()<\/code><\/li>\n<li><code>=STDEV.S()<\/code> เพราะใช้ sample; <code>.P<\/code> สำหรับ population<\/li>\n<li>Normalize: <code>=(B2-$MIN)/($MAX-$MIN)<\/code><\/li>\n<li>Standardize: <code>=(B2-$MEAN)/$SD<\/code><\/li>\n<li>กด F4 เพื่อล็อก cell reference<\/li>\n<\/ul>"}, {"id": "n47", "label": "H3. Assignment 3 ข้อ", "level": 2, "children": [], "body": "<ol>\n<li>Pearson r ของ <code>(160,55), (170,65), (180,75)<\/code> พร้อมบอก strength และ direction<\/li>\n<li>เลือกฟีเจอร์ useful/irrelevant สำหรับทำนายราคาบ้านพร้อมเหตุผล<\/li>\n<li>วิเคราะห์ correlation ระหว่างขนมกับน้ำอัดลม เสนอ feature รวม 1 ตัว และบอกประโยชน์<\/li>\n<\/ol>\n<p>สถานะใน S6: อาจารย์จะโพสต์บ่ายวันนั้น ส่งภายในเที่ยงคืนวันนั้น และคาบหน้าจะเฉลยข้อ 1<\/p>"}, {"id": "n48", "label": "H4. Zoom Assignment #7 — Power BI", "level": 2, "children": [], "body": "<p>สร้าง dashboard <strong>1 หน้า<\/strong> ให้ตอบได้:<\/p>\n<ul>\n<li>KPI: Total Sales, Average Order Value, Total Orders, จำนวนลูกค้า โดยใช้ Card<\/li>\n<li>Sales Trend: line ตามเวลา<\/li>\n<li>Product Performance: bar และ Top selling<\/li>\n<li>Customer Analysis<\/li>\n<li>Sales by Category<\/li>\n<li>มี Slicer และตกแต่งให้ professional<\/li>\n<\/ul>\n<p>ส่งภาพหน้าจอและตอบ 5 ข้อ:<\/p>\n<ol>\n<li>Top-selling products คืออะไร<\/li>\n<li>ลูกค้าคนใดสร้างรายได้สูงสุด<\/li>\n<li>Sales trend over time เป็นอย่างไร<\/li>\n<li>แต่ละ category แตกต่างกันอย่างไร<\/li>\n<li>Average order value เท่าไร<\/li>\n<\/ol>"}, {"id": "n49", "label": "H5. ประกาศ", "level": 2, "children": [], "body": "<ul>\n<li>งดเรียน 2 สัปดาห์: สัปดาห์ Open House และสัปดาห์ที่อาจารย์พานักศึกษาไปดูงาน<\/li>\n<li>อาจารย์จะประกาศวัน/ชื่อคาบแทนภายหลัง<\/li>\n<li>เมื่อกลับมาเรียนจะเริ่ม Association Analysis<\/li>\n<li>ถ้าไม่มี Power BI Desktop ให้ใช้เว็บด้วยบัญชีมหิดล<\/li>\n<\/ul>\n<hr />"}], "body": "<p>หมวดนี้มี 5 กิ่งย่อย<\/p>"}]}, COURSE="EGCO623";
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),wrap=document.getElementById('mapWrap');
let selected=TREE,zoom=1,query='';const expanded=new Set(['root']);const done=new Set(JSON.parse(localStorage.getItem('mindmap-done-'+COURSE)||'[]'));
const parent=new Map(),byId=new Map();function index(n,p=null){byId.set(n.id,n);if(p)parent.set(n.id,p);(n.children||[]).forEach(c=>index(c,n))}index(TREE);
function visibleChildren(n){return expanded.has(n.id)?(n.children||[]):[]}
function wrapLines(text,max=22){const words=[];for(const token of text.split(/\s+/)){if(token.length<=max)words.push(token);else for(let i=0;i<token.length;i+=max)words.push(token.slice(i,i+max))}const lines=[''];for(const w of words){let i=lines.length-1;if((lines[i]+' '+w).trim().length>max&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim()}return lines}
function prepareNode(n){n._lines=wrapLines(n.label);n._h=Math.max(56,18+n._lines.length*18)}
function layout(){let next=42,maxDepth=0;const rows=[];function walk(n,d){prepareNode(n);maxDepth=Math.max(maxDepth,d);const cs=visibleChildren(n);let center;if(!cs.length){n._y=next;center=n._y+n._h/2;next+=n._h+26}else{const centers=cs.map(c=>walk(c,d+1));center=(centers[0]+centers[centers.length-1])/2;n._y=center-n._h/2}n._x=34+d*248;rows.push(n);return center}walk(TREE,0);return{nodes:rows,width:Math.max(900,80+(maxDepth+1)*248),height:Math.max(650,next+40)}}
function el(name,attrs={}){const x=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))x.setAttribute(k,v);return x}
function render(){const L=layout();svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${L.width} ${L.height}`);svg.style.width=(L.width*zoom)+'px';svg.style.height=(L.height*zoom)+'px';const shown=new Set(L.nodes.map(n=>n.id));L.nodes.forEach(n=>{if(n.id==='root')return;const p=parent.get(n.id);if(!shown.has(p.id))return;const path=el('path',{d:`M ${p._x+190} ${p._y+p._h/2} C ${p._x+220} ${p._y+p._h/2}, ${n._x-30} ${n._y+n._h/2}, ${n._x} ${n._y+n._h/2}`,class:'edge'+((selected.id===n.id||selected.id===p.id)?' active':'')});svg.appendChild(path)});L.nodes.forEach(n=>{const g=el('g',{class:'node '+(n.id==='root'?'root ':'')+((n.children||[]).length?'branch ':'')+(selected.id===n.id?'selected ':'')+(done.has(n.id)?'done ':'')+(query&&nodeText(n).includes(query)?'match ':'') ,transform:`translate(${n._x},${n._y})`,'data-id':n.id,tabindex:'0',role:'button','aria-label':n.label});g.appendChild(el('rect',{width:190,height:n._h,rx:4}));const lines=n._lines;lines.forEach((line,i)=>{const t=el('text',{x:12,y:22+i*18});t.textContent=line;g.appendChild(t)});if((n.children||[]).length){const t=el('text',{x:174,y:n._h/2+5,class:'small','text-anchor':'middle'});t.textContent=expanded.has(n.id)?'−':'+';g.appendChild(t)}if(done.has(n.id)){const c=el('circle',{cx:181,cy:8,r:5,class:'status'});g.appendChild(c)}g.addEventListener('click',()=>choose(n,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n,true)}});svg.appendChild(g)});document.getElementById('visibleCount').textContent=L.nodes.length+' กิ่งที่แสดง'}
function nodeText(n){return(n.label+' '+strip(n.body)).toLowerCase()}function strip(x){const d=document.createElement('div');d.innerHTML=x;return d.textContent||''}
function pathOf(n){const a=[n.label];while(parent.has(n.id)){n=parent.get(n.id);a.unshift(n.label)}return a.join(' › ')}
function choose(n,toggle){selected=n;if(toggle&&(n.children||[]).length){expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id)}document.getElementById('crumb').textContent=pathOf(n);document.getElementById('detailTitle').textContent=n.label;document.getElementById('detail').innerHTML=n.body;document.getElementById('doneBtn').textContent=done.has(n.id)?'อ่านแล้ว ✓':'ทำเครื่องหมายว่าอ่านแล้ว';render()}
function setAll(open){byId.forEach(n=>{if((n.children||[]).length){open?expanded.add(n.id):expanded.delete(n.id)}});expanded.add('root');render()}
document.getElementById('expand').onclick=()=>setAll(true);document.getElementById('collapse').onclick=()=>setAll(false);document.getElementById('zin').onclick=()=>{zoom=Math.min(1.8,zoom+.15);render()};document.getElementById('zout').onclick=()=>{zoom=Math.max(.55,zoom-.15);render()};document.getElementById('reset').onclick=()=>{zoom=1;wrap.scrollTo(0,0);render()};document.getElementById('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('mindmap-theme',n)};const th=localStorage.getItem('mindmap-theme');if(th)document.documentElement.dataset.theme=th;
document.getElementById('doneBtn').onclick=()=>{done.has(selected.id)?done.delete(selected.id):done.add(selected.id);localStorage.setItem('mindmap-done-'+COURSE,JSON.stringify([...done]));choose(selected,false)};
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();if(query){byId.forEach(n=>{if(nodeText(n).includes(query)){let x=n;while(parent.has(x.id)){x=parent.get(x.id);expanded.add(x.id)}}})}render();const hits=[...byId.values()].filter(n=>query&&nodeText(n).includes(query));document.getElementById('searchStatus').textContent=query?hits.length+' จุดที่พบ':''});
let drag=false,sx=0,sy=0,sl=0,st=0;wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag=true;sx=e.clientX;sy=e.clientY;sl=wrap.scrollLeft;st=wrap.scrollTop;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(drag){wrap.scrollLeft=sl-(e.clientX-sx);wrap.scrollTop=st-(e.clientY-sy)}});wrap.addEventListener('pointerup',()=>{drag=false;wrap.classList.remove('dragging')});
choose(TREE,false);
</script></body></html>
