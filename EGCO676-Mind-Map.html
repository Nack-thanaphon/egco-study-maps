.toolbar{display:flex;gap:7px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);overflow:auto}.toolbar button,.toolbar input,.back{min-height:44px;border:1px solid var(--line);background:var(--paper);padding:7px 10px;text-decoration:none}.toolbar button{cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible,.back:hover{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}#search{width:260px}.spacer{flex:1}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,34vw);min-height:0}.map-wrap{position:relative;overflow:auto;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-color:color-mix(in srgb,var(--paper) 93%,var(--bg));cursor:grab}.map-wrap.dragging{cursor:grabbing;user-select:none}svg{display:block;min-width:100%;min-height:100%}.edge{fill:none;stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--accent);stroke-width:3}.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.node.branch rect{fill:var(--soft);stroke:var(--accent)}.node.root rect{fill:var(--accent);stroke:var(--accent)}.node.root text{fill:white}.node text{fill:var(--ink);font-family:DBHeavent,sans-serif;font-size:17px;pointer-events:none}.node .small{font-size:13px;fill:var(--muted)}.node.root .small{fill:#fff;opacity:.82}.node{cursor:pointer}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3}.node.match rect{stroke:#d18a15;stroke-width:4}.node.done rect{stroke:var(--done)}.node .status{fill:var(--done)}
.inspector{border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}.crumb{color:var(--muted);font-size:15px;margin-bottom:5px}.inspector h2{font-size:28px;line-height:1.12;margin:0 0 9px}.inspect-actions{display:flex;gap:6px;margin:9px 0 15px}.inspect-actions button{border:1px solid var(--line);background:var(--paper);min-height:44px;padding:7px 10px;cursor:pointer}.detail h1,.detail h2,.detail h3{font-size:22px}.detail h4{font-size:20px}.detail p{margin:6px 0 11px}.detail ul,.detail ol{padding-left:23px}.detail li{margin:3px 0}.detail blockquote{margin:10px 0;padding:8px 11px;background:var(--soft);border:1px solid var(--accent)}code{background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:1px 4px;font:14px ui-monospace,SFMono-Regular,monospace}pre{overflow:auto;white-space:pre-wrap;background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace}table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:9px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;min-width:80px}th{background:var(--soft)}.empty{color:var(--muted)}
.legend{position:sticky;left:10px;bottom:10px;display:inline-flex;gap:10px;background:var(--paper);border:1px solid var(--line);padding:6px 9px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:var(--accent)}.dot.done{background:var(--done)}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100%}header{align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr;grid-template-rows:62vh auto}.inspector{border-left:0;border-top:2px solid var(--ink);min-height:45vh}.toolbar{flex-wrap:wrap}#search{width:100%;order:3}.spacer{display:none}}
@media print{body{overflow:visible}.app{display:block}.toolbar,.legend{display:none}.workspace{display:block}.map-wrap{height:70vh;border-bottom:2px solid #000}.inspector{border:0}.inspect-actions{display:none}}
</style></head><body><div class="app"><header><div><h1>EGCO676 · Information Security &amp; Cryptography</h1><p>Mind Map จาก Slack หลังเรียนจริง — คลิกกิ่งเพื่ออ่านรายละเอียด</p></div><span class="badge">6 สรุปคาบ + 1 correction</span></header><nav class="toolbar"><a class="back" href="index.html">← ทุกวิชา</a><button id="expand">ขยายทั้งหมด</button><button id="collapse">ย่อทั้งหมด</button><button id="zin" aria-label="ซูมเข้า">＋</button><button id="zout" aria-label="ซูมออก">−</button><button id="reset">รีเซ็ต</button><input id="search" type="search" placeholder="ค้นหาในวิชา"><span id="searchStatus"></span><span class="spacer"></span><span id="visibleCount"></span><button id="theme" aria-label="สลับโหมดสี">◐</button><button onclick="window.print()">พิมพ์/PDF</button></nav><div class="workspace"><div id="mapWrap" class="map-wrap"><svg id="map" aria-label="แผนผัง EGCO676"></svg><div class="legend"><span><i class="dot"></i>กิ่งหลัก</span><span><i class="dot done"></i>อ่านแล้ว</span></div></div><aside class="inspector"><div id="crumb" class="crumb"></div><h2 id="detailTitle"></h2><div class="inspect-actions"><button id="doneBtn">ทำเครื่องหมายว่าอ่านแล้ว</button></div><div id="detail" class="detail"></div></aside></div></div><script>
const TREE={"id": "root", "label": "EGCO676", "subtitle": "Information Security & Cryptography", "level": 0, "body": "<p><strong>EGCO676 — Information Security &amp; Cryptography<\/strong><\/p><p>คลิกกิ่งเพื่อเปิดรายละเอียด แล้วกดอีกครั้งเพื่อย่อหรือขยาย<\/p>", "children": [{"id": "n1", "label": "เนื้อหา Week 1 — Introduction", "level": 1, "children": [{"id": "n2", "label": "เป้าหมาย CIA", "level": 2, "children": [], "body": "<ul>\n<li><strong>Confidentiality:<\/strong> คนไม่มีสิทธิ์อ่านข้อมูลไม่ได้<\/li>\n<li><strong>Integrity:<\/strong> ข้อมูลไม่ถูกแก้โดยไม่ได้รับอนุญาต และควรตรวจพบเมื่อเปลี่ยน<\/li>\n<li><strong>Availability:<\/strong> ระบบ/ข้อมูลพร้อมใช้เมื่อจำเป็น; DoS/DDoS มุ่งทำลายด้านนี้<\/li>\n<li>CIA ยังไม่พอ ต้องมี <strong>Authentication, Authorization, Accountability/Auditing และ Non-repudiation<\/strong><\/li>\n<li>ตัวอย่าง Mobile Banking: อ่านยอดไม่ได้ = C; เปลี่ยนยอดหรือเลขบัญชีไม่ได้ = I; โอนได้เมื่อจำเป็น = A; ระบบต้องพิสูจน์ตัวตนและจำกัดสิทธิ์<\/li>\n<\/ul>"}, {"id": "n3", "label": "Threat, Vulnerability, Risk", "level": 2, "children": [], "body": "<ul>\n<li><strong>Threat:<\/strong> สิ่งที่อาจสร้างความเสียหาย เช่น แฮกเกอร์ ไฟไหม้ น้ำท่วม ความผิดพลาด<\/li>\n<li><strong>Vulnerability:<\/strong> จุดอ่อนที่ภัยคุกคามใช้โจมตีได้<\/li>\n<li><strong>Countermeasure:<\/strong> มาตรการลดโอกาสหรือผลกระทบ<\/li>\n<li>Risk analysis พิจารณาความสำคัญข้อมูล มูลค่าระบบ ภัยคุกคาม และช่องโหว่ แล้วเลือก <strong>ลด / ยอมรับ / โอน / ควบคุม<\/strong> ความเสี่ยง<\/li>\n<\/ul>"}, {"id": "n4", "label": "หลักออกแบบระบบปลอดภัย", "level": 2, "children": [], "body": "<ul>\n<li><strong>Defense in Depth:<\/strong> ป้องกันหลายชั้น—กายภาพ คน ขั้นตอน เครือข่าย และข้อมูล<\/li>\n<li>สมดุล <strong>Security กับ Usability/Access<\/strong>: เข้มเกินไปใช้ยาก; ง่ายเกินไปเสี่ยง<\/li>\n<li><strong>Top-down<\/strong> มักสำเร็จกว่า เพราะผู้บริหารกำหนดนโยบาย เป้าหมาย ผู้รับผิดชอบ และบังคับใช้ทั้งองค์กร<\/li>\n<li><strong>ลด Attack Surface:<\/strong> ลดช่องทางเข้าและสิ่งที่เปิดให้โจมตีเท่าที่จำเป็น<\/li>\n<\/ul>"}, {"id": "n5", "label": "แผนเนื้อหาคริปโทกราฟี", "level": 2, "children": [], "body": "<ul>\n<li>Symmetric cryptography<\/li>\n<li>Asymmetric/Public-key และ PQC<\/li>\n<li>Hash, MAC, Digital Signature และ PKI<\/li>\n<li><strong>Key Management<\/strong> เป็นความเสี่ยงสำคัญ: เลือก เก็บ ป้องกัน อัปเดต และยกเลิกกุญแจ<\/li>\n<\/ul>"}, {"id": "n6", "label": "คะแนนและหมุดหมายที่ประกาศใน Week 1", "level": 2, "children": [], "body": "<ul>\n<li>Assignment 3 ครั้ง × 5% = <strong>15%<\/strong><\/li>\n<li>Term Project 4 ช่วง = <strong>55%<\/strong><\/li>\n<li>Topic <strong>5%<\/strong><\/li>\n<li>Literature Review <strong>10%<\/strong><\/li>\n<li>Progress/Methodology <strong>15%<\/strong><\/li>\n<li>Final Presentation + Report <strong>25%<\/strong><\/li>\n<li>Examination = <strong>30%<\/strong><\/li>\n<li>โปรเจกต์เป็น <strong>งานเดี่ยว<\/strong> ใช้เป็นหัวข้อจบจริงได้ และ <strong>ไม่จำเป็นต้องเป็น Security<\/strong> แต่ต้องใช้หัวข้อเดียวต่อเนื่องทั้งเทอม<\/li>\n<li>ปลายเทอมอย่างน้อยควรมี <strong>ผลทดลองเบื้องต้น<\/strong> เพื่อเตรียมหาอาจารย์ที่ปรึกษาและสอบหัวข้อในปี 1 เทอม 2<\/li>\n<li>วันที่ตามการแก้ตารางด้วยวาจาในห้อง:<\/li>\n<li><strong>26 Sep:<\/strong> Project 01 — Topic, Motivation, Objective, Expected Outcome<\/li>\n<li><strong>17 Oct:<\/strong> Project 02 — Literature Review<\/li>\n<li><strong>7 Nov:<\/strong> Project 03 — Methodology / Research Progress<\/li>\n<li><strong>21 Nov:<\/strong> Examination<\/li>\n<li><strong>28 Nov:<\/strong> Final Presentation + Report<\/li>\n<li><strong>12 Sep:<\/strong> งดเรียน<\/li>\n<li>คำเตือนจาก S1: ตารางยัง <strong>tentative<\/strong> ให้ยึดประกาศล่าสุดใน Google Classroom<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>ป้ายกำกับ:<\/strong> 15 ส.ค. 2026 · อ้างอิง S1<\/p>"}, {"id": "n7", "label": "เนื้อหา Week 2 — Symmetric Cryptography", "level": 1, "children": [{"id": "n8", "label": "CIA กับรูปแบบภัยคุกคาม", "level": 2, "children": [], "body": "<ul>\n<li>C → <strong>Snooping<\/strong> (ดักฟัง/ดักอ่าน)<\/li>\n<li>I → <strong>Masquerading<\/strong>, <strong>Replay<\/strong>, <strong>Modification<\/strong><\/li>\n<li>ตัวอย่าง Replay ในห้อง: ใช้ Wi‑Fi ฟรีร้านกาแฟแล้ว session login ถูกขโมยไปใช้ซ้ำ<\/li>\n<li>A → <strong>DoS<\/strong> (ยัด request จนเว็บล่ม)<\/li>\n<li>Authentication มี 2 ระดับ: ยืนยัน <strong>ตัวคน<\/strong> และยืนยัน <strong>ตัวข้อมูล<\/strong><\/li>\n<li>Non-repudiation ใช้บุคคลที่ 3 ตรวจสอบ; เปรียบกับ Shopee/Lazada/PayPal แบบ escrow<\/li>\n<li><strong>IAA:<\/strong> Identification → Authentication → Accountability/Audit<\/li>\n<\/ul>"}, {"id": "n9", "label": "Cryptography กับ Steganography", "level": 2, "children": [], "body": "<ul>\n<li>Cryptography ทำข้อความให้อ่านไม่ได้<\/li>\n<li>Steganography ซ่อนข้อความในภาพด้วยการเปลี่ยนบิตพิกเซลเล็กน้อย และอาจใส่ password/key ซ้อน<\/li>\n<li>ตัวอย่างที่ข้อความบันทึกว่าอาจารย์เล่า: ผู้ก่อการร้าย 9/11 ใช้ภาพสื่อสารแผน<\/li>\n<\/ul>"}, {"id": "n10", "label": "Symmetric key และสมการ", "level": 2, "children": [], "body": "<ul>\n<li>ใช้กุญแจ 1 ดอกทั้งเข้ารหัสและถอดรหัส<\/li>\n<li><code>C = E(K, P)<\/code> และ <code>P = D(K, C)<\/code><\/li>\n<li>P = Plaintext/Message, C = Ciphertext, K = Key, E = Encrypt, D = Decrypt<\/li>\n<li>ปัญหาหลักคือ <strong>key distribution<\/strong><\/li>\n<li><strong>Kerckhoffs:<\/strong> ความลับต้องอยู่ที่กุญแจ; อัลกอริทึมเปิดเผยได้<\/li>\n<\/ul>"}, {"id": "n11", "label": "แบบจำลองการโจมตี 4 แบบ", "level": 2, "children": [], "body": "<p>เรียงจากสมมติฐานอ่อนไปแรง:<\/p>\n<ol>\n<li><strong>Ciphertext only:<\/strong> ผู้โจมตีมีเพียง ciphertext; ระบบต้องทนแบบนี้เป็นขั้นต่ำ<\/li>\n<li><strong>Known plaintext:<\/strong> รู้คู่ plaintext ↔ ciphertext บางชุด; ตัวอย่าง Alan Turing/Enigma จากรายงานสภาพอากาศ และข้อความระบุว่าเยอรมันเปลี่ยน key ทุก 24 ชั่วโมง<\/li>\n<li><strong>Chosen plaintext:<\/strong> ผู้โจมตีเลือก plaintext ส่งให้ระบบเข้ารหัส<\/li>\n<li><strong>Chosen ciphertext:<\/strong> ผู้โจมตีเลือก ciphertext ส่งให้ระบบถอดรหัส<\/li>\n<\/ol>"}, {"id": "n12", "label": "DES → Double DES → 3DES → AES", "level": 2, "children": [], "body": "<ul>\n<li><strong>DES:<\/strong> ยุค 70s; block 64 บิต, key 56 บิต, 16 รอบ; ข้อความระบุว่าปัจจุบันคอมบ้านแกะได้ในไม่กี่ชั่วโมง จึงเลิกใช้<\/li>\n<li><strong>Double DES:<\/strong> คาดหวัง 2^112 แต่โดน meet-in-the-middle เหลือประมาณ <strong>2^57<\/strong><\/li>\n<li><strong>Triple DES:<\/strong> เข้า K1 → ถอด K2 → เข้า K1; ใช้กุญแจจริง 2 ดอก; <strong>ห้ามสลับลำดับ<\/strong><\/li>\n<li><strong>AES:<\/strong> มาตรฐานปัจจุบัน; ข้อความระบุว่าฝังในชิป Intel ราว 2008–2009<\/li>\n<li>key 128 / 192 / 256 บิต<\/li>\n<li>10 / 12 / 14 รอบ<\/li>\n<li>SubBytes → ShiftRows → MixColumns → AddRoundKey<\/li>\n<li>รอบสุดท้ายไม่มี MixColumns<\/li>\n<li>คำแนะนำในข้อความ: ถ้าข้อสอบถามว่าควรใช้อะไร ให้ตอบ AES<\/li>\n<\/ul>"}, {"id": "n13", "label": "Modes of operation", "level": 2, "children": [], "body": "<ul>\n<li><strong>ECB:<\/strong> เร็ว ขนานได้ error ไม่กระจาย; block เหมือนกันให้ผลเหมือนกัน จึงเสี่ยง frequency analysis; ข้อความระบุว่าเหมาะกับข้อความสั้น/ส่ง key<\/li>\n<li><strong>CBC:<\/strong> XOR กับผล block ก่อนและใช้ IV; ลด pattern ซ้ำ แต่ต้องเรียงลำดับและ error กระจายไป block ถัดไป<\/li>\n<li><strong>CFB:<\/strong> คล้าย CBC แต่ดึงบางบิต; error อาจหายระหว่างทางแต่ไม่รับประกัน; ใช้ได้ทั้ง block/stream; ความเร็วยังช้า<\/li>\n<li><strong>OFB:<\/strong> feedback จากจุดที่ยังไม่ผ่านการเข้ารหัส; เตรียม keystream ล่วงหน้าได้; เร็ว ผลไม่ซ้ำ error ไม่กระจาย<\/li>\n<li><strong>CTR:<\/strong> ใช้ counter เปลี่ยนค่าทุก block; ข้อความสรุปว่าเร็ว ขนานได้ ไม่ซ้ำ และ error ไม่กระจาย<\/li>\n<\/ul>"}, {"id": "n14", "label": "Stream cipher และคำแนะนำรหัสผ่าน", "level": 2, "children": [], "body": "<ul>\n<li>เข้ารหัสทีละบิต; หัวใจอยู่ที่ key generation<\/li>\n<li>คอมพิวเตอร์สร้าง pseudo-random ซึ่งวนซ้ำได้<\/li>\n<li>password สั้นทำให้ keystream วนซ้ำเร็วและถูกจับ pattern ง่าย<\/li>\n<li>ข้อความสรุปจากอาจารย์ว่า <strong>ความยาวสำคัญกว่าความซับซ้อน<\/strong><\/li>\n<li>แนะนำ <strong>12–15 ตัวอักษร + MFA<\/strong> และใช้ password manager โดยจำ master password ยาวเพียงตัวเดียว<\/li>\n<\/ul>"}, {"id": "n15", "label": "ประกาศ Week 2 หลังใช้ correction", "level": 2, "children": [], "body": "<ul>\n<li>สัปดาห์นั้น <strong>ไม่มีการบ้าน EGCO676<\/strong><\/li>\n<li>การบ้านครั้งแรกมาช่วง <strong>Week 4<\/strong> หลัง 3 คาบแรกเรื่อง crypto + integrity<\/li>\n<li>คาบถัดไป: Asymmetric key + Quantum<\/li>\n<li>อีกประมาณ 1 เดือนมีการนำเสนองานครั้งที่ 1<\/li>\n<li>ตารางสอบวิจัย/กำหนดยื่นก่อนสอบ: ดูในสไลด์<\/li>\n<li>3 ต.ค. make-up class อาจถูกงดหากตรงกับซ้อมใหญ่รับปริญญา 5–6 ต.ค.; รอประกาศ<\/li>\n<li><strong>ตัดออกจาก EGCO676:<\/strong> “หางานวิจัย 2 เรื่องมาอ่านในห้อง” และ CITI Program เป็นของ <strong>EGCO604 (Research Methodology)<\/strong> ตาม C1<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>ป้ายกำกับ:<\/strong> 22 ส.ค. 2026 · อ้างอิง S2 + S3 และใช้ C1 แก้ข้อมูลท้าย S3<\/p>"}, {"id": "n16", "label": "เนื้อหา Week 3 — Asymmetric, Hybrid, Signature, ECC, Post-Quantum", "level": 1, "children": [{"id": "n17", "label": "Asymmetric แก้ปัญหาอะไร", "level": 2, "children": [], "body": "<ul>\n<li>กุญแจ 2 ดอก: public/private แก้ pain point เรื่องการส่งกุญแจของ symmetric<\/li>\n<li>อุปมาตู้ไปรษณีย์: public key คือช่องหยอด; private key คือกุญแจเปิดตู้<\/li>\n<li>เข้ารหัสและถอดรหัสเป็นคนละสมการ<\/li>\n<li>แจก public key ลอย ๆ ไม่ได้ เพราะผู้โจมตีอาจสลับกุญแจ; ต้องมีระบบกลางรับรองและกระจายกุญแจ<\/li>\n<\/ul>"}, {"id": "n18", "label": "ตัวเลขขนาดกุญแจ", "level": 2, "children": [], "body": "<p>ความปลอดภัยระดับที่ข้อความเทียบเท่า AES 128 บิต:<\/p>\n<ul>\n<li>AES = <strong>128 บิต<\/strong> ขั้นต่ำ<\/li>\n<li>RSA = <strong>3072 บิต<\/strong> หรือประมาณ 24 เท่าของ AES<\/li>\n<li>ECC = <strong>256 บิต<\/strong> หรือ 2 เท่าของ AES<\/li>\n<li>ตัวอย่างการคำนวณในคาบ: <code>1314^57 mod ...<\/code><\/li>\n<li><strong>RSA-512 ≈ DES 56 บิต<\/strong> ตามข้อความสรุป<\/li>\n<\/ul>"}, {"id": "n19", "label": "Hybrid encryption", "level": 2, "children": [], "body": "<ul>\n<li>ใช้ asymmetric ครั้งแรกเพื่อส่ง symmetric session key ขนาด <strong>128 บิต<\/strong><\/li>\n<li>หลังจากนั้นใช้ symmetric ตลอด session เพราะเร็วกว่า<\/li>\n<\/ul>"}, {"id": "n20", "label": "Encryption กับ Digital Signature", "level": 2, "children": [], "body": "<ul>\n<li>Encryption: ใช้ public key ของผู้รับ → confidentiality<\/li>\n<li>Signature: ใช้ private key ของผู้ส่งเซ็น แล้วใช้ public key ของผู้ส่ง verify<\/li>\n<li>Signature ให้ authentication + integrity + non-repudiation<\/li>\n<li><strong>คำเตือน:<\/strong> signature ไม่ให้ confidentiality; ผู้ดักอ่านยังเห็นข้อความ ถ้าต้องการความลับต้อง encrypt เพิ่ม<\/li>\n<li>ในทางปฏิบัติ hash ข้อความก่อน แล้วเซ็น digest แทนการเซ็นทั้งข้อความ<\/li>\n<li>ตัวเลข hash ใน S4:<\/li>\n<li>MD5 = 128 บิต (เลิกใช้)<\/li>\n<li>SHA‑1 = 160 บิต (เลิกแนะนำ)<\/li>\n<li>SHA‑2 = 256 บิต (ขั้นต่ำที่ควรใช้)<\/li>\n<li>SHA‑3 = 256–512 บิต<\/li>\n<\/ul>"}, {"id": "n21", "label": "Trapdoor one-way function และตระกูลหลัก", "level": 2, "children": [], "body": "<ul>\n<li>One-way: ไปข้างหน้าง่าย ย้อนกลับยาก<\/li>\n<li>Trapdoor: ถ้ามี private key จึงย้อนกลับได้ง่าย<\/li>\n<li>RSA: ปัญหาแยกตัวประกอบ; ตัวอย่างในข้อความ 92 × 97 และ 8924<\/li>\n<li>ElGamal / Diffie-Hellman: discrete logarithm<\/li>\n<li>ECC: จุดบนเส้นโค้งกำลังสาม; บวก/ดับเบิลจุดไปข้างหน้าง่าย ย้อนกลับยาก<\/li>\n<\/ul>"}, {"id": "n22", "label": "ECC", "level": 2, "children": [], "body": "<ul>\n<li>256 บิต ≈ RSA 3072 บิต; ประมวลผลเร็ว ใช้พลังงานน้อย เหมาะกับมือถือ/IoT/หุ่นยนต์<\/li>\n<li>ข้อความระบุ Perfect Forward Secrecy ว่ากุญแจหนึ่งรั่วไม่ทำให้เปิดกุญแจอื่นในอนาคตได้<\/li>\n<li>ใช้กับ TLS, digital signature และอุปกรณ์เล็ก<\/li>\n<li><strong>คำเตือน:<\/strong> ECC ไม่รอดจาก quantum<\/li>\n<\/ul>"}, {"id": "n23", "label": "Post-Quantum", "level": 2, "children": [], "body": "<ul>\n<li>Shor algorithm ปี <strong>1994<\/strong> ทำลายโจทย์แยกตัวประกอบและ discrete logarithm<\/li>\n<li>RSA, Diffie-Hellman, ECDH/ECDSA ไม่รอดตามข้อความ<\/li>\n<li>ข้อความเปรียบเทียบเวลาเจาะ RSA‑3072: คอมธรรมดา &gt;100 ปี; quantum เหลือไม่กี่วัน<\/li>\n<li><strong>Harvest now, decrypt later:<\/strong> ขโมย ciphertext วันนี้ รอ quantum แล้วค่อยถอด; ธนาคาร/โรงพยาบาลเสี่ยงเพราะข้อมูลต้องลับหลายสิบปี<\/li>\n<li>ข้อความคาดการณ์ quantum ใช้จริงราว <strong>2030<\/strong> หรือประมาณ 4–5 ปีข้างหน้า<\/li>\n<li>กลุ่มที่ข้อความระบุว่ายังรอด: lattice-based (เช่น NTRU), code-based, hash-based signature, multivariate<\/li>\n<li>Symmetric เช่น AES ยังใช้ได้ด้วยการเพิ่มความยาวกุญแจ<\/li>\n<li>การเปลี่ยน infrastructure ถูกเปรียบกับ IPv4 → IPv6 ซึ่งเปลี่ยนมาประมาณ 10 ปียังไม่เสร็จ<\/li>\n<li>QKD ต้องต่อ fiber ตรง; อุปกรณ์ราว <strong>50,000 ดอลลาร์ (~1.7 ล้านบาท)<\/strong> ต่อเครื่อง<\/li>\n<li>เกร็ดในข้อความ: Bitcoin ใช้ SHA‑256; หาก quantum จัดการได้ ชุมชนต้องเปลี่ยนกลไกใน chain<\/li>\n<\/ul>"}, {"id": "n24", "label": "ประกาศและคำถามฝึกจาก S5", "level": 2, "children": [], "body": "<ul>\n<li>Open House มหิดล <strong>5–6 ต.ค.<\/strong> → ข้อความระบุคาบ <strong>5 ต.ค.<\/strong> ย้าย online ผ่าน <strong>Cisco WebEx<\/strong>; อาจารย์จะโพสต์ link ก่อน 1–2 วัน<\/li>\n<li>ซ้อมใหญ่รับพระราชทาน <strong>3–4 ต.ค.<\/strong> → คาบอาทิตย์นั้น online; ข้อความระบุว่าเป็น lecture จึงไม่กระทบการนำเสนอ<\/li>\n<li><strong>งดคาบ 12 ต.ค.<\/strong> เพราะอาจารย์มิ่งมีภารกิจช่วงเช้าและอาจารย์ธนัสนีฯ ไปอบรมต่างประเทศ; เหลือคาบ 13 ต.ค.<\/li>\n<li>Assignment ชิ้นแรกประมาณ 1 เดือน; ผู้ยังไม่มีหัวข้อให้รีบหา/ถามอาจารย์<\/li>\n<li>นำเสนอรอบแรก <strong>26 ก.ย. onsite<\/strong><\/li>\n<li>ข้อความระบุ “คาบหน้า (5 ต.ค.) online ต่อเรื่อง hash + integrity”<\/li>\n<li>สไลด์บท 3 จะอัปโหลดใหม่เพราะ font ไทยทำให้เลขสมการเพี้ยน<\/li>\n<li>โอกาสวิจัย: proposal 1 ปี ปีงบ 70 เรื่อง <strong>crypto-agility framework<\/strong> สำหรับองค์กร 3–5 ประเภท; วางกำลัง ป.โท 3 คน + ป.ตรี 3–4 คน; สถานะ <strong>ยื่นแล้ว ยังไม่ได้รับทุน<\/strong><\/li>\n<li>คำถามฝึก 4 ข้อ: เหตุผลที่ TLS ใช้ symmetric กับข้อมูลจริง; signature เซ็นบน hash; ความอ่อนของ RSA‑512; อัลกอริทึมใดรอด/ไม่รอด quantum<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>ป้ายกำกับ:<\/strong> คาบ 29 ส.ค. 2569 · อ้างอิง S4 + S5<\/p>"}, {"id": "n25", "label": "เนื้อหา Week 4 — Hash, MAC, Digital Signature, Key Management, Kerberos, PKI", "level": 1, "children": [{"id": "n26", "label": "Hash และคุณสมบัติ", "level": 2, "children": [], "body": "<ul>\n<li>Hash ปกป้อง <strong>integrity<\/strong> ไม่ใช่ confidentiality<\/li>\n<li>ให้ digest/fingerprint ขนาดคงที่; เปลี่ยน input 1 บิตทำให้ผลเปลี่ยนทั้งหมดตามข้อความ<\/li>\n<li>คุณสมบัติ 3 ข้อ: <strong>preimage resistance, second-preimage resistance, collision resistance<\/strong><\/li>\n<li>โครงสร้างมาตรฐาน: Merkle–Damgård = compression function + padding; SHA‑3 ใช้ sponge<\/li>\n<li>MD5 = <strong>128 บิต<\/strong>, SHA‑1 = <strong>160 บิต<\/strong> พบ collision แล้วและไม่แนะนำ<\/li>\n<li>ใช้อย่างต่ำ SHA‑256 หรือ SHA‑3<\/li>\n<\/ul>"}, {"id": "n27", "label": "MDC กับ MAC", "level": 2, "children": [], "body": "<ul>\n<li><strong>MDC:<\/strong> ตรวจ integrity อย่างเดียว ไม่มี key<\/li>\n<li><strong>MAC:<\/strong> hash + secret key จึงเพิ่ม authentication<\/li>\n<\/ul>"}, {"id": "n28", "label": "Digital Signature และ DSS/DSA", "level": 2, "children": [], "body": "<ul>\n<li>private key เซ็น; public key verify<\/li>\n<li>เป็นความสัมพันธ์ <strong>1 ข้อความ : 1 ลายเซ็น<\/strong> ต่างจากลายเซ็นกระดาษแบบ one-to-many เพื่อกันคัดลอกลายเซ็นไปใช้กับข้อความอื่น<\/li>\n<li>ให้ authentication + integrity + non-repudiation แต่ <strong>ไม่ให้ confidentiality<\/strong><\/li>\n<li>RSA เซ็นตรง ๆ มีตัวเลขมากกว่า <strong>3,000 บิต<\/strong> จึงเซ็น digest แทน<\/li>\n<li><strong>DSS/DSA<\/strong> ทำได้เฉพาะ signature<\/li>\n<li>ข้อความระบุว่า DSA เร็วกว่าและ signature สั้นกว่า ElGamal เมื่อขนาด <code>p<\/code> เท่ากัน<\/li>\n<li><strong>คำเตือน:<\/strong> collision ของ hash ไม่เกี่ยวกับขนาด signature<\/li>\n<\/ul>"}, {"id": "n29", "label": "Symmetric key management, KDC และ Kerberos", "level": 2, "children": [], "body": "<ul>\n<li>จุดอ่อนใหญ่สุดคือการกระจายกุญแจ; หากโจมตีระบบจัดเก็บสำเร็จอาจได้กุญแจทุกคนพร้อมกัน<\/li>\n<li><strong>KDC:<\/strong> ลงทะเบียนก่อน; เมื่อขอสื่อสาร KDC สร้าง one-time session key ห่อด้วยกุญแจ KDC↔ผู้ใช้ และยกเลิกเมื่อจบ session<\/li>\n<li>การขยาย KDC: flat multiple KDC หรือ hierarchical จาก local → national → root<\/li>\n<li><strong>Kerberos (หมา 3 หัว):<\/strong> AS ตรวจตัวตน → TGS ออก ticket → Real Server ให้บริการ<\/li>\n<li>ข้อความระบุการแลกเปลี่ยนรวม <strong>6 ข้อความ<\/strong><\/li>\n<li>realm ใหญ่เดียวช่วยให้ login ครั้งเดียวใช้หลาย service<\/li>\n<\/ul>"}, {"id": "n30", "label": "Public-key management และ PKI", "level": 2, "children": [], "body": "<ul>\n<li>public key แจกแบบไม่รับรองไม่ได้ เพราะ man-in-the-middle อาจสลับกุญแจ อ่านและแก้ข้อมูล<\/li>\n<li>CA ออก certificate มาตรฐาน <strong>X.509<\/strong><\/li>\n<li>field ที่ข้อความระบุ: version, serial, algorithm, issuer, validity, subject, public key<\/li>\n<li>CA hash ข้อมูล certificate แล้วเซ็นด้วย private key ของ CA<\/li>\n<li>ตัวอย่างในข้อความ: certificate เว็บมหิดลออกโดย GoDaddy; self-signed certificate ทำให้ browser เตือน<\/li>\n<li>งาน CA: <strong>issue / renew / revoke<\/strong>; delta CRL แจ้งรายการยกเลิกเป็นรอบ<\/li>\n<li>CA เชื่อมกันเป็น chain of trust จาก root ในเครื่อง<\/li>\n<li>PKI = CA + RA + repository + users<\/li>\n<li>วงจรกุญแจ: ลงทะเบียน → สร้าง → ติดตั้ง → ใช้ → backup/recover → update → revoke → ทำลาย<\/li>\n<\/ul>"}, {"id": "n31", "label": "ประกาศ Week 4", "level": 2, "children": [], "body": "<ul>\n<li><strong>12/09 งดเรียน<\/strong> ให้ใช้เวลาทำการบ้าน<\/li>\n<li>การบ้าน: <strong>TryHackMe 3 ห้อง (ฟรี)<\/strong><\/li>\n<li>ส่ง screenshot หน้า achievement ก่อนเรียน <strong>เสาร์ 19/09<\/strong><\/li>\n<li>Presentation ครั้งที่ 1 <strong>5% วันที่เสาร์ 26/09<\/strong><\/li>\n<li>ภายในวันนำเสนอต้องมี <strong>หัวข้อ + ขอบเขต/วัตถุประสงค์<\/strong>; ข้อความระบุว่าเหลือประมาณ 3 อาทิตย์<\/li>\n<\/ul>"}, {"id": "n32", "label": "แถบ “เชื่อมทุกแนวคิด”", "level": 2, "children": [], "body": "<p>Hash ตรวจการแก้ไข → ใส่ secret key เป็น MAC เพื่อยืนยันผู้ส่ง → ใช้ private key เซ็น digest เป็น digital signature → X.509 ผูก public key กับเจ้าของ → PKI จัดการโครงสร้างความเชื่อถือทั้งหมด<\/p>\n<hr />"}], "body": "<p><strong>ป้ายกำกับ:<\/strong> ชื่อข้อความระบุคาบ 5/09/2026; โพสต์ใน export 2026-09-07 UTC · อ้างอิง S6<\/p>"}, {"id": "n33", "label": "ส่วนรวม “การบ้าน คะแนน และกำหนดการ”", "level": 1, "children": [], "body": "<p>จัดเป็น timeline โดยใส่ <code>source<\/code> ทุกแถว และไม่พยายามแก้ความขัดแย้งเอง:<\/p>\n<table>\n<thead>\n<tr>\n<th>วันที่/ช่วง<\/th>\n<th>รายการ<\/th>\n<th style=\"text-align: right;\">ตัวเลขสำคัญ<\/th>\n<th>แหล่ง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>12 Sep<\/td>\n<td>งดเรียน<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>S1, S6<\/td>\n<\/tr>\n<tr>\n<td>ก่อนเรียน 19/09<\/td>\n<td>ส่ง screenshot achievement TryHackMe<\/td>\n<td style=\"text-align: right;\">3 ห้อง ฟรี<\/td>\n<td>S6<\/td>\n<\/tr>\n<tr>\n<td>26 Sep<\/td>\n<td>Project/Presentation ครั้งที่ 1 onsite<\/td>\n<td style=\"text-align: right;\">5%; หัวข้อ + motivation/objective/expected outcome ตาม S1; หัวข้อ + ขอบเขต/วัตถุประสงค์ตาม S6<\/td>\n<td>S1, S5, S6<\/td>\n<\/tr>\n<tr>\n<td>3–4 Oct<\/td>\n<td>ซ้อมใหญ่; ข้อความหนึ่งระบุคาบอาทิตย์นั้น online<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>S5<\/td>\n<\/tr>\n<tr>\n<td>5–6 Oct<\/td>\n<td>Open House; ข้อความระบุคาบ 5 Oct online ผ่าน WebEx<\/td>\n<td style=\"text-align: right;\">link ก่อน 1–2 วัน<\/td>\n<td>S5<\/td>\n<\/tr>\n<tr>\n<td>12 Oct<\/td>\n<td>งดคาบ<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>S5<\/td>\n<\/tr>\n<tr>\n<td>13 Oct<\/td>\n<td>คาบถัดไป รอยืนยัน<\/td>\n<td style=\"text-align: right;\">—<\/td>\n<td>S5<\/td>\n<\/tr>\n<tr>\n<td>17 Oct<\/td>\n<td>Project 02 Literature Review<\/td>\n<td style=\"text-align: right;\">10%<\/td>\n<td>S1<\/td>\n<\/tr>\n<tr>\n<td>7 Nov<\/td>\n<td>Project 03 Methodology/Research Progress<\/td>\n<td style=\"text-align: right;\">15%<\/td>\n<td>S1<\/td>\n<\/tr>\n<tr>\n<td>21 Nov<\/td>\n<td>Examination<\/td>\n<td style=\"text-align: right;\">30%<\/td>\n<td>S1<\/td>\n<\/tr>\n<tr>\n<td>28 Nov<\/td>\n<td>Final Presentation + Report<\/td>\n<td style=\"text-align: right;\">25%<\/td>\n<td>S1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />"}, {"id": "n34", "label": "Correction และคำเตือน", "level": 1, "children": [], "body": "<ol>\n<li><strong>Correction (C1):<\/strong> “หางานวิจัย 2 เรื่องมาอ่านในห้อง” และ <strong>CITI Program<\/strong> เป็นของ EGCO604 ไม่ใช่ EGCO676; ห้ามนำไปแสดงเป็นงาน EGCO676<\/li>\n<li><strong>ตารางเปลี่ยนได้:<\/strong> S1 ระบุ tentative และให้ยึดประกาศล่าสุดใน Google Classroom<\/li>\n<li><strong>วันที่ใน S5 ไม่สอดคล้องกับลำดับเวลา:<\/strong> ข้อความโพสต์ 29 ส.ค. แต่ระบุ “คาบหน้า (5 ต.ค.)”; ให้แสดงตามต้นฉบับพร้อมป้าย <strong>รอยืนยัน<\/strong> ไม่แก้เป็น 5 ก.ย. เอง<\/li>\n<li><strong>S5 ระบุเองว่า<\/strong> timeline 12–13 ต.ค. รอยืนยันจากประกาศอาจารย์ซ้ำในกลุ่ม<\/li>\n<li><strong>Week 4 มีวันที่โพสต์ไม่ตรงชื่อคาบ:<\/strong> export โพสต์ 7 ก.ย. UTC แต่ชื่อข้อความระบุคาบ 5/09/2026; HTML ควรเขียนว่า “คาบ 5 ก.ย. (โพสต์ 7 ก.ย.)”<\/li>\n<\/ol>\n<hr />"}]}, COURSE="EGCO676";
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),wrap=document.getElementById('mapWrap');
let selected=TREE,zoom=1,query='';const expanded=new Set(['root']);const done=new Set(JSON.parse(localStorage.getItem('mindmap-done-'+COURSE)||'[]'));
const parent=new Map(),byId=new Map();function index(n,p=null){byId.set(n.id,n);if(p)parent.set(n.id,p);(n.children||[]).forEach(c=>index(c,n))}index(TREE);
function visibleChildren(n){return expanded.has(n.id)?(n.children||[]):[]}
function layout(){let next=42,maxDepth=0;const rows=[];function walk(n,d){maxDepth=Math.max(maxDepth,d);const cs=visibleChildren(n);let y;if(!cs.length){y=next;next+=82}else{const ys=cs.map(c=>walk(c,d+1));y=(ys[0]+ys[ys.length-1])/2}n._x=34+d*248;n._y=y;rows.push(n);return y}walk(TREE,0);return{nodes:rows,width:Math.max(900,80+(maxDepth+1)*248),height:Math.max(650,next+40)}}
function el(name,attrs={}){const x=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))x.setAttribute(k,v);return x}
function wrapLines(text,max=22){const words=text.split(/\s+/),lines=[''];for(const w of words){let i=lines.length-1;if((lines[i]+' '+w).trim().length>max&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim()}return lines.slice(0,3)}
function render(){const L=layout();svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${L.width} ${L.height}`);svg.style.width=(L.width*zoom)+'px';svg.style.height=(L.height*zoom)+'px';const shown=new Set(L.nodes.map(n=>n.id));L.nodes.forEach(n=>{if(n.id==='root')return;const p=parent.get(n.id);if(!shown.has(p.id))return;const path=el('path',{d:`M ${p._x+190} ${p._y+28} C ${p._x+220} ${p._y+28}, ${n._x-30} ${n._y+28}, ${n._x} ${n._y+28}`,class:'edge'+((selected.id===n.id||selected.id===p.id)?' active':'')});svg.appendChild(path)});L.nodes.forEach(n=>{const g=el('g',{class:'node '+(n.id==='root'?'root ':'')+((n.children||[]).length?'branch ':'')+(selected.id===n.id?'selected ':'')+(done.has(n.id)?'done ':'')+(query&&nodeText(n).includes(query)?'match ':'') ,transform:`translate(${n._x},${n._y})`,'data-id':n.id,tabindex:'0',role:'button','aria-label':n.label});g.appendChild(el('rect',{width:190,height:56,rx:4}));const lines=wrapLines(n.label);lines.forEach((line,i)=>{const t=el('text',{x:12,y:21+i*17});t.textContent=(i===2&&lines.length>3)?line+'…':line;g.appendChild(t)});if((n.children||[]).length){const t=el('text',{x:174,y:34,class:'small','text-anchor':'middle'});t.textContent=expanded.has(n.id)?'−':'+';g.appendChild(t)}if(done.has(n.id)){const c=el('circle',{cx:181,cy:8,r:5,class:'status'});g.appendChild(c)}g.addEventListener('click',()=>choose(n,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n,true)}});svg.appendChild(g)});document.getElementById('visibleCount').textContent=L.nodes.length+' กิ่งที่แสดง'}
function nodeText(n){return(n.label+' '+strip(n.body)).toLowerCase()}function strip(x){const d=document.createElement('div');d.innerHTML=x;return d.textContent||''}
function pathOf(n){const a=[n.label];while(parent.has(n.id)){n=parent.get(n.id);a.unshift(n.label)}return a.join(' › ')}
function choose(n,toggle){selected=n;if(toggle&&(n.children||[]).length){expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id)}document.getElementById('crumb').textContent=pathOf(n);document.getElementById('detailTitle').textContent=n.label;document.getElementById('detail').innerHTML=n.body;document.getElementById('doneBtn').textContent=done.has(n.id)?'อ่านแล้ว ✓':'ทำเครื่องหมายว่าอ่านแล้ว';render()}
function setAll(open){byId.forEach(n=>{if((n.children||[]).length){open?expanded.add(n.id):expanded.delete(n.id)}});expanded.add('root');render()}
document.getElementById('expand').onclick=()=>setAll(true);document.getElementById('collapse').onclick=()=>setAll(false);document.getElementById('zin').onclick=()=>{zoom=Math.min(1.8,zoom+.15);render()};document.getElementById('zout').onclick=()=>{zoom=Math.max(.55,zoom-.15);render()};document.getElementById('reset').onclick=()=>{zoom=1;wrap.scrollTo(0,0);render()};document.getElementById('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('mindmap-theme',n)};const th=localStorage.getItem('mindmap-theme');if(th)document.documentElement.dataset.theme=th;
document.getElementById('doneBtn').onclick=()=>{done.has(selected.id)?done.delete(selected.id):done.add(selected.id);localStorage.setItem('mindmap-done-'+COURSE,JSON.stringify([...done]));choose(selected,false)};
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();if(query){byId.forEach(n=>{if(nodeText(n).includes(query)){let x=n;while(parent.has(x.id)){x=parent.get(x.id);expanded.add(x.id)}}})}render();const hits=[...byId.values()].filter(n=>query&&nodeText(n).includes(query));document.getElementById('searchStatus').textContent=query?hits.length+' จุดที่พบ':''});
let drag=false,sx=0,sy=0,sl=0,st=0;wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag=true;sx=e.clientX;sy=e.clientY;sl=wrap.scrollLeft;st=wrap.scrollTop;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(drag){wrap.scrollLeft=sl-(e.clientX-sx);wrap.scrollTop=st-(e.clientY-sy)}});wrap.addEventListener('pointerup',()=>{drag=false;wrap.classList.remove('dragging')});
choose(TREE,false);
</script></body></html>
