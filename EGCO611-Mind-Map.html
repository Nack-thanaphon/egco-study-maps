.toolbar{display:flex;gap:7px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);overflow:auto}.toolbar button,.toolbar input,.back{min-height:44px;border:1px solid var(--line);background:var(--paper);padding:7px 10px;text-decoration:none}.toolbar button{cursor:pointer}.toolbar button:hover,.toolbar button:focus-visible,.back:hover{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}#search{width:260px}.spacer{flex:1}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,34vw);min-height:0}.map-wrap{position:relative;overflow:auto;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-color:color-mix(in srgb,var(--paper) 93%,var(--bg));cursor:grab}.map-wrap.dragging{cursor:grabbing;user-select:none}svg{display:block;min-width:100%;min-height:100%}.edge{fill:none;stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--accent);stroke-width:3}.node rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}.node.branch rect{fill:var(--soft);stroke:var(--accent)}.node.root rect{fill:var(--accent);stroke:var(--accent)}.node.root text{fill:white}.node text{fill:var(--ink);font-family:DBHeavent,sans-serif;font-size:17px;pointer-events:none}.node .small{font-size:13px;fill:var(--muted)}.node.root .small{fill:#fff;opacity:.82}.node{cursor:pointer}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3}.node.match rect{stroke:#d18a15;stroke-width:4}.node.done rect{stroke:var(--done)}.node .status{fill:var(--done)}
.inspector{border-left:1px solid var(--line);overflow:auto;padding:16px 18px 40px}.crumb{color:var(--muted);font-size:15px;margin-bottom:5px}.inspector h2{font-size:28px;line-height:1.12;margin:0 0 9px}.inspect-actions{display:flex;gap:6px;margin:9px 0 15px}.inspect-actions button{border:1px solid var(--line);background:var(--paper);min-height:44px;padding:7px 10px;cursor:pointer}.detail h1,.detail h2,.detail h3{font-size:22px}.detail h4{font-size:20px}.detail p{margin:6px 0 11px}.detail ul,.detail ol{padding-left:23px}.detail li{margin:3px 0}.detail blockquote{margin:10px 0;padding:8px 11px;background:var(--soft);border:1px solid var(--accent)}code{background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:1px 4px;font:14px ui-monospace,SFMono-Regular,monospace}pre{overflow:auto;white-space:pre-wrap;background:color-mix(in srgb,var(--soft) 70%,var(--paper));border:1px solid var(--line);padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace}table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:9px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;min-width:80px}th{background:var(--soft)}.empty{color:var(--muted)}
.legend{position:sticky;left:10px;bottom:10px;display:inline-flex;gap:10px;background:var(--paper);border:1px solid var(--line);padding:6px 9px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:var(--accent)}.dot.done{background:var(--done)}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100%}header{align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr;grid-template-rows:62vh auto}.inspector{border-left:0;border-top:2px solid var(--ink);min-height:45vh}.toolbar{flex-wrap:wrap}#search{width:100%;order:3}.spacer{display:none}}
@media print{body{overflow:visible}.app{display:block}.toolbar,.legend{display:none}.workspace{display:block}.map-wrap{height:70vh;border-bottom:2px solid #000}.inspector{border:0}.inspect-actions{display:none}}
</style></head><body><div class="app"><header><div><h1>EGCO611 · Mathematical Modelling</h1><p>Mind Map จาก Slack หลังเรียนจริง — คลิกกิ่งเพื่ออ่านรายละเอียด</p></div><span class="badge">8 สรุปคาบ + 2 drills</span></header><nav class="toolbar"><a class="back" href="index.html">← ทุกวิชา</a><button id="expand">ขยายทั้งหมด</button><button id="collapse">ย่อทั้งหมด</button><button id="zin" aria-label="ซูมเข้า">＋</button><button id="zout" aria-label="ซูมออก">−</button><button id="reset">รีเซ็ต</button><input id="search" type="search" placeholder="ค้นหาในวิชา"><span id="searchStatus"></span><span class="spacer"></span><span id="visibleCount"></span><button id="theme" aria-label="สลับโหมดสี">◐</button><button onclick="window.print()">พิมพ์/PDF</button></nav><div class="workspace"><div id="mapWrap" class="map-wrap"><svg id="map" aria-label="แผนผัง EGCO611"></svg><div class="legend"><span><i class="dot"></i>กิ่งหลัก</span><span><i class="dot done"></i>อ่านแล้ว</span></div></div><aside class="inspector"><div id="crumb" class="crumb"></div><h2 id="detailTitle"></h2><div class="inspect-actions"><button id="doneBtn">ทำเครื่องหมายว่าอ่านแล้ว</button></div><div id="detail" class="detail"></div></aside></div></div><script>
const TREE={"id": "root", "label": "EGCO611", "subtitle": "Mathematical Modelling", "level": 0, "body": "<p><strong>EGCO611 — Mathematical Modelling<\/strong><\/p><p>คลิกกิ่งเพื่อเปิดรายละเอียด แล้วกดอีกครั้งเพื่อย่อหรือขยาย<\/p>", "children": [{"id": "n1", "label": "Mathematical Modelling: เปลี่ยนโลกจริงเป็นสมการ", "level": 1, "children": [{"id": "n2", "label": "A1. แก่นของโมเดล", "level": 2, "children": [], "body": "<ul>\n<li>โมเดลคณิตศาสตร์คือการเลือกส่วนสำคัญของระบบจริงมาเขียนเป็นสมการ เพื่ออธิบาย ทำนาย หรือหาคำตอบที่ดีที่สุด<\/li>\n<li>โมเดลไม่ใช่ระบบทั้งหมด: ต้องกำหนด <strong>system boundary<\/strong> และตัดรายละเอียดที่มีผลน้อยออก<\/li>\n<li>หน่วยต้องตรงกัน ห้ามบวกหรือเปรียบเทียบปริมาณคนละหน่วย<\/li>\n<li>ทุกโมเดลมี assumptions และต้องตรวจ sensitivity, uncertainty และ validation<\/li>\n<\/ul>"}, {"id": "n3", "label": "A2. ขั้นตอนสร้างโมเดล 6 ขั้น", "level": 2, "children": [], "body": "<ol>\n<li>Define Problem — ต้องการรู้อะไร<\/li>\n<li>System Boundary — รวมอะไรและตัดอะไรออก<\/li>\n<li>Assumptions — สมมติอะไรเพื่อทำให้แก้ได้<\/li>\n<li>Equations — เขียนความสัมพันธ์<\/li>\n<li>Solve — แก้เป็นสูตรหรือใช้คอมพิวเตอร์<\/li>\n<li>Validate — เทียบกับความจริง<\/li>\n<\/ol>"}, {"id": "n4", "label": "A3. ตัวอย่างในคาบ", "level": 2, "children": [], "body": "<ul>\n<li>CPU cooling: หาปริมาณพัดลมหรือน้ำหล่อเย็นเพื่อควบคุมอุณหภูมิ<\/li>\n<li>ระบบท่อน้ำมัน: คุมอัตราการไหลจาก A ไป B โดยท่อไม่ระเบิด<\/li>\n<li>เครื่องผลิตน้ำตาล: เปิด–ปิดวาล์วเพื่อให้ throughput ดีที่สุด<\/li>\n<li>การขายเนื้อวัว: กำไร = รายได้ − ต้นทุน; จุดกำไรสูงสุดประมาณวันที่ 8<\/li>\n<li>Dynamic systems: อุณหภูมิและการแพร่โรค<\/li>\n<li>Lotka–Volterra: จำนวนเหยื่อและนักล่าขึ้นลงตามเวลา<\/li>\n<li>SIR: <code>S → I → R<\/code>; ถ้ามีกลุ่มเสียชีวิตเรียก SIRD<\/li>\n<li><code>dx/dt<\/code> = อัตราการเปลี่ยนแปลงของ <code>x<\/code> ตามเวลา<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S1] “สรุป EGCO611 — Mathematical Modelling”, ข้อความวันที่ 11 ส.ค. 2026<\/p>"}, {"id": "n5", "label": "Linear Programming: โครงสร้าง สมมติฐาน และการตั้งโมเดล", "level": 1, "children": [{"id": "n6", "label": "B1. สมการมาตรฐานและความหมาย", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">maximize cᵀx\nsubject to Ax ≤ b\n           ℓ ≤ x ≤ u\n<\/code><\/pre>\n<ul>\n<li><code>x<\/code>: ตัวแปรตัดสินใจ<\/li>\n<li><code>c<\/code>: คะแนน/กำไร/ประโยชน์ต่อหน่วย<\/li>\n<li><code>cᵀx<\/code>: ผลรวม “ประโยชน์ต่อหน่วย × จำนวนที่เลือก”<\/li>\n<li><code>A<\/code>: ตารางการใช้ทรัพยากร<\/li>\n<li><code>b<\/code>: ทรัพยากรที่มี<\/li>\n<li><code>Ax ≤ b<\/code>: ใช้รวมไม่เกินของที่มี<\/li>\n<li><code>ℓ ≤ x ≤ u<\/code>: ขอบล่างและขอบบน<\/li>\n<\/ul>"}, {"id": "n7", "label": "B2. โมเดล LP ที่ครบมี 5 ส่วน", "level": 2, "children": [], "body": "<ol>\n<li>Sets/Indices<\/li>\n<li>Parameters<\/li>\n<li>Decision Variables<\/li>\n<li>Objective<\/li>\n<li>Constraints/Bounds<\/li>\n<\/ol>"}, {"id": "n8", "label": "B3. เงื่อนไขว่าอะไรเป็น Linear", "level": 2, "children": [], "body": "<ul>\n<li>ใช้ได้: <code>5x₁ + 3x₂<\/code><\/li>\n<li>ไม่เป็น linear: <code>x₁x₂<\/code>, <code>x₁²<\/code>, <code>1/x₁<\/code>, <code>log(x₁)<\/code>, <code>eˣ¹<\/code><\/li>\n<\/ul>"}, {"id": "n9", "label": "B4. สมมติฐาน LP 4 ข้อ", "level": 2, "children": [], "body": "<ul>\n<li><strong>Proportionality:<\/strong> ทำเพิ่ม 2 เท่า ผลและทรัพยากรเพิ่ม 2 เท่า<\/li>\n<li><strong>Additivity:<\/strong> ผลรวมมาจากแต่ละกิจกรรมบวกกัน ไม่มี interaction เช่น <code>x₁x₂<\/code><\/li>\n<li><strong>Divisibility:<\/strong> ตัวแปรแบ่งเป็นทศนิยมได้ เช่น ชั่วโมง พลังงาน bandwidth และ flow<\/li>\n<li><strong>Certainty:<\/strong> coefficient ถือว่ารู้แน่นอนในช่วงวางแผน<\/li>\n<\/ul>\n<blockquote>\n<p>จำนวน server หรือการตัดสินใจ yes/no ไม่ผ่าน Divisibility ต้องใช้ Integer/Mixed-Integer Programming ไม่ควรแก้ LP แล้วปัดเอง<\/p>\n<\/blockquote>"}, {"id": "n10", "label": "B5. แปลโจทย์เป็น constraint", "level": 2, "children": [], "body": "<ul>\n<li>“ใช้ได้ไม่เกิน” → <code>usage ≤ availability<\/code><\/li>\n<li>“ต้องได้อย่างน้อย” → <code>service ≥ requirement<\/code><\/li>\n<li>“เข้าเท่ากับออก” → <code>input = output<\/code><\/li>\n<li>“ห้ามติดลบ” → <code>x ≥ 0<\/code><\/li>\n<\/ul>\n<p>ตัวอย่างแบ่ง CPU/Memory:<\/p>\n<pre><code class=\"language-text\">maximize Σ pᵢxᵢ\nsubject to Σ cᵢxᵢ ≤ C\n           Σ mᵢxᵢ ≤ M\n           xᵢ ≥ 0\n<\/code><\/pre>"}, {"id": "n11", "label": "B6. Checklist ตั้งโมเดล 9 ขั้น", "level": 2, "children": [], "body": "<ol>\n<li>ระบุสิ่งที่เลือกและผลที่ต้องการ<\/li>\n<li>กำหนดขอบเขตระบบและช่วงเวลา<\/li>\n<li>เขียน assumptions<\/li>\n<li>นิยาม set, parameter, variable พร้อมหน่วย<\/li>\n<li>เขียน objective<\/li>\n<li>แปลงข้อกำหนดทุกข้อเป็น constraint<\/li>\n<li>ใส่ bounds/nonnegativity<\/li>\n<li>ตรวจหน่วยทั้งสองข้าง<\/li>\n<li>ทดลองค่าพื้นฐาน เช่น <code>x = 0<\/code><\/li>\n<\/ol>"}, {"id": "n12", "label": "B7. สถานะคำตอบและการวินิจฉัย", "level": 2, "children": [], "body": "<ul>\n<li>Feasible: ผ่านทุก constraint<\/li>\n<li>Infeasible: ไม่มีคำตอบที่ผ่านทั้งหมด<\/li>\n<li>Optimal: feasible และ objective ดีที่สุด<\/li>\n<li>Unbounded: objective ดีขึ้นได้ไม่สิ้นสุด มักขาด capacity/demand constraint หรือใส่เครื่องหมายผิด<\/li>\n<li>Slack: <code>s = b − aᵀx<\/code>; ถ้า <code>s = 0<\/code> constraint เป็น binding<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S2] “EGCO 611 — Linear Programming Formulations”, ข้อความวันที่ 16 ส.ค. 2026<\/p>"}, {"id": "n13", "label": "SciPy linprog: จากสมการสู่โปรแกรมและการแปลผล", "level": 1, "children": [{"id": "n14", "label": "C1. อินพุตที่ solver ต้องการ", "level": 2, "children": [], "body": "<ul>\n<li><code>c<\/code>: สัมประสิทธิ์ objective<\/li>\n<li><code>A_ub, b_ub<\/code>: constraint แบบ <code>≤<\/code><\/li>\n<li><code>A_eq, b_eq<\/code>: constraint แบบ <code>=<\/code><\/li>\n<li><code>bounds<\/code>: ขอบล่าง–ขอบบน; <code>x ≥ 0<\/code> ใช้ lower bound 0, ไม่มีขอบบนใช้ <code>None<\/code>/∞<\/li>\n<li>constraint แบบ <code>≥<\/code> ต้องคูณ <code>−1<\/code> ทั้งสองข้างก่อนส่งเป็น <code>≤<\/code><\/li>\n<\/ul>\n<pre><code class=\"language-python\">scipy.optimize.linprog(c, A_ub, b_ub, A_eq, b_eq, bounds)\n<\/code><\/pre>\n<ul>\n<li>default ปัจจุบันคือ HiGHS; เนื้อหาต้นทางระบุว่าโค้ดเก่าที่กำหนด Simplex ต้องอัปเดต<\/li>\n<li><code>linprog<\/code> แก้ minimization: โจทย์ maximize ต้องคูณ objective ด้วย <code>−1<\/code> ก่อน และคูณ <code>−1<\/code> คืนเมื่ออ่านผล<\/li>\n<li>อ่าน <code>res.success<\/code>, <code>res.x<\/code>, <code>res.fun<\/code>, <code>res.message<\/code><\/li>\n<\/ul>"}, {"id": "n15", "label": "C2. ตัวเลขตัวอย่างในห้อง", "level": 2, "children": [], "body": "<ul>\n<li>คำตอบที่รายงาน: <code>X₁ = 46.67<\/code>, <code>X₂ = 0<\/code>, <code>X₃ = 26.67<\/code><\/li>\n<li>กำไรประมาณ <code>3,133<\/code><\/li>\n<li>ตัวอย่างตรวจ constraint อีกช่วงหนึ่งรายงานว่าใช้จริง <code>166<\/code> จากเพดาน <code>180<\/code><\/li>\n<li>หมายเหตุจาก [S5]: ตัวเลขบางค่าอ่านจากเสียงและอาจคลาดเคลื่อนเล็กน้อย<\/li>\n<\/ul>"}, {"id": "n16", "label": "C3. แปลผล 4 ชั้น", "level": 2, "children": [], "body": "<ol>\n<li><strong>Constraint check:<\/strong> แทน <code>res.x<\/code> กลับทุก constraint<\/li>\n<li><strong>Slack:<\/strong> <code>b − A·x<\/code>; ตัวอย่าง CPU มี 180 ใช้ 146 เหลือ 34 [S3]<\/li>\n<li><strong>Marginal value:<\/strong> เพิ่มทรัพยากรทีละ 1 แล้วแก้ใหม่\n   - CPU <code>+11<\/code>\n   - Memory <code>+0<\/code>\n   - Bandwidth <code>+3.33<\/code><\/li>\n<li><strong>Utilization:<\/strong> <code>(A·x) ÷ b<\/code>; <code>1.0<\/code> = ใช้ครบ, <code>0.92<\/code> = ใช้ 92%<\/li>\n<\/ol>"}, {"id": "n17", "label": "C4. ข้อควรระวังจากคาบ", "level": 2, "children": [], "body": "<ul>\n<li>NumPy <code>@<\/code> = matrix multiplication; <code>*<\/code> = element-wise<\/li>\n<li>ตรวจ shape ก่อนคูณ<\/li>\n<li>Parameter คือ <code>c, A, b<\/code>; variable คือ <code>x<\/code><\/li>\n<li>ตรวจตัวแปร/มิติให้ตรงกัน เช่น อย่าให้ <code>X₄<\/code> อยู่ใน objective แต่หายจาก constraint<\/li>\n<li>Solver ให้ optimum ของสมการที่ป้อน ไม่รับรองว่าโมเดลตรงโลกจริง<\/li>\n<li>ถ้า <code>success=False<\/code> ให้ตรวจ infeasible, unbounded และ constraint ที่หายไป<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S3] “EGCO611 คาบ 13:20 — Linear Programming ลง Python + วิเคราะห์ผลลัพธ์”, 23 ส.ค. 2026; [S5] “EGCO611 · Linear Programming — แปลงโจทย์เป็นโปรแกรม”, คาบ 23 ส.ค. 13:20–15:00<\/p>"}, {"id": "n18", "label": "Reformulation: แปลงโจทย์ให้ solver รับได้", "level": 1, "children": [], "body": "<p><strong>อ้างอิง:<\/strong> [S2], [S3], [S4], [S5]<\/p>\n<ul>\n<li>ขอบเขตซ้อน: <code>L ≤ x ≤ U<\/code> → <code>x ≥ L<\/code> และ <code>x ≤ U<\/code><\/li>\n<li>คูณ inequality ด้วยค่าติดลบต้องกลับเครื่องหมาย: <code>aᵀx ≥ b ⇔ −aᵀx ≤ −b<\/code><\/li>\n<li>ตัวแปร free: <code>y = y⁺ − y⁻<\/code>, โดย <code>y⁺, y⁻ ≥ 0<\/code><\/li>\n<li>ค่าสัมบูรณ์: ตั้ง <code>d<\/code> แล้วใช้ <code>−d ≤ f−a ≤ d<\/code>; รูปเทียบเท่าคือ <code>d ≥ f−a<\/code> และ <code>d ≥ a−f<\/code><\/li>\n<li>Minimax: เพิ่ม <code>z<\/code>, บังคับ <code>z ≥ aᵢx+bᵢ<\/code> ทุกกรณี แล้ว minimize <code>z<\/code><\/li>\n<li>เรื่องเล่า minimax: บริษัทเก็บค่าซ่อมเฉพาะเครื่องที่แพงที่สุด จึงวางแผนให้ “ค่าที่แพงที่สุด” ต่ำที่สุด<\/li>\n<\/ul>\n<hr />"}, {"id": "n19", "label": "ILP/MILP และ Branch & Bound", "level": 1, "children": [{"id": "n20", "label": "E1. ตระกูลโมเดล", "level": 2, "children": [], "body": "<ul>\n<li>LP: ตัวแปรต่อเนื่องทั้งหมด<\/li>\n<li>ILP: ตัวแปรจำนวนเต็มทั้งหมด<\/li>\n<li>Binary: integer ที่มีเพียง 0/1<\/li>\n<li>MILP: ผสม continuous กับ integer<\/li>\n<\/ul>\n<p>ตัวอย่างที่ต้องเป็น integer: จำนวนโต๊ะ จำนวน CPU จำนวน server; ตัวอย่าง binary: เปิดเครื่องหรือไม่ เลือกสายสื่อสารหรือไม่ งานทั้งก้อนไปเครื่องใด<\/p>"}, {"id": "n21", "label": "E2. ทำไม rounding ใช้ไม่ได้", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">6x₁ + 4x₂ ≤ 9\n<\/code><\/pre>\n<ul>\n<li>[S4] รายงาน LP ได้ <code>x₁=0.8, x₂=0.9<\/code><\/li>\n<li>[S6] รายงานค่าประมาณ <code>0.87, 0.74<\/code><\/li>\n<li>ทั้งสองข้อความชี้ผลเดียวกัน: ปัดขึ้นเป็น <code>(1,1)<\/code> แล้วได้ <code>6+4=10 &gt; 9<\/code> จึงผิด constraint<\/li>\n<\/ul>\n<blockquote>\n<p>HTML ควรแสดงสองค่าตามแต่ละข้อความ ไม่ควรรวมเป็นค่ากลาง เพราะต้นทางให้ตัวเลขต่างกัน<\/p>\n<\/blockquote>"}, {"id": "n22", "label": "E3. Relaxation + Branch & Bound", "level": 2, "children": [], "body": "<ol>\n<li>คลาย integer/binary เป็นจำนวนจริงชั่วคราว เช่น <code>{0,1}<\/code> → <code>[0,1]<\/code><\/li>\n<li>ถ้าได้ <code>y=3.6<\/code> ให้แตกกิ่ง <code>y ≤ 3<\/code> และ <code>y ≥ 4<\/code><\/li>\n<li>แก้ใหม่แต่ละกิ่ง<\/li>\n<li>ตัดกิ่ง infeasible หรือไม่ดีกว่า incumbent<\/li>\n<li>ทำต่อจนได้คำตอบ integer<\/li>\n<\/ol>\n<ul>\n<li>ต้นทางเปรียบกับ backtracking/DFS ของ Sudoku และกล่าวถึงการแตกกิ่งแบบกว้าง/BFS<\/li>\n<li>จำนวนกิ่งโตแบบเลขชี้กำลัง: binary 10 ตัว → <code>2¹⁰<\/code>; binary 100 ตัว → <code>2¹⁰⁰<\/code><\/li>\n<\/ul>"}, {"id": "n23", "label": "E4. Logic constraints", "level": 2, "children": [], "body": "<ul>\n<li>Exactly one: <code>Σy = 1<\/code><\/li>\n<li>At most one: <code>Σy ≤ 1<\/code><\/li>\n<li>At most P: <code>Σy ≤ P<\/code><\/li>\n<li>At least 3: <code>Σy ≥ 3<\/code><\/li>\n<li>A ต้องมี B: <code>y_A ≤ y_B<\/code><\/li>\n<li>A และ B ห้ามพร้อมกัน: <code>y_A + y_B ≤ 1<\/code><\/li>\n<li>Linking: <code>0 ≤ x ≤ U·y<\/code><\/li>\n<li>Big-M: <code>aᵀx ≤ b + M(1−y)<\/code>; M ใหญ่เกินไปทำให้แก้ช้าหรือเพี้ยน<\/li>\n<\/ul>"}, {"id": "n24", "label": "E5. ตัวอย่างโต๊ะ–ตู้", "level": 2, "children": [], "body": "<ul>\n<li>โต๊ะ: กำไร 40 บาท, ไม้ 4 ชิ้น, แรงงาน 2 ชม.<\/li>\n<li>ตู้: กำไร 30 บาท, ไม้ 3 ชิ้น, แรงงาน 1 ชม.<\/li>\n<li>มีไม้ 24 ชิ้น, แรงงาน 10 ชม., ตู้ขายได้ไม่เกิน 5 ตัว<\/li>\n<\/ul>\n<pre><code class=\"language-text\">max 40x₁ + 30x₂\ns.t. 4x₁ + 3x₂ ≤ 24\n     2x₁ + x₂ ≤ 10\n     x₂ ≤ 5\n     x₁,x₂ ∈ ℤ≥₀\n<\/code><\/pre>"}, {"id": "n25", "label": "E6. ตัวอย่างผลิตแบบ batch", "level": 2, "children": [], "body": "<ul>\n<li>รายรับ/กำไรที่ระบุ: 50 ต่อ batch<\/li>\n<li>setup 1 ครั้ง = 100 บาท และได้ไม่เกิน 6 batch<\/li>\n<li>batch ละ 2 ชม.; เวลาปกติ 8 ชม.; OT ไม่เกิน 4 ชม.; OT 20 บาท/ชม.<\/li>\n<li><code>x<\/code> = จำนวน batch (integer), <code>h<\/code> = OT (continuous), <code>y<\/code> = setup (binary)<\/li>\n<\/ul>\n<pre><code class=\"language-text\">max 50x − 20h − 100y\ns.t. 2x ≤ 8 + h\n     x ≤ 6y\n     h ≤ 4\n     x ∈ ℤ≥₀, h ≥ 0, y ∈ {0,1}\n<\/code><\/pre>\n<p><code>x ≤ 6y<\/code> ทำให้ถ้า <code>y=0<\/code> แล้ว <code>x=0<\/code><\/p>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S4] “Reformulation + Integer Programming (MILP)”, 23 ส.ค.; [S6] “Integer Programming — เมื่อคำตอบต้องเป็นชิ้นๆ”, คาบ 23 ส.ค. 15:07–16:00; [S7] ทบทวนวันที่ 30 ส.ค.<\/p>"}, {"id": "n26", "label": "Server / Workload / Task Assignment", "level": 1, "children": [{"id": "n27", "label": "F1. เลือก CPU ให้ server หนึ่งเครื่อง — ILP", "level": 2, "children": [], "body": "<ul>\n<li>CPU-A: computing 8, memory 4, ราคา 6<\/li>\n<li>CPU-B: computing 5, memory 8, ราคา 5<\/li>\n<li>ต้องการ computing ≥ 40, memory ≥ 32, มี 7 สล็อต<\/li>\n<\/ul>\n<pre><code class=\"language-text\">min 6x_A + 5x_B\ns.t. 8x_A + 5x_B ≥ 40\n     4x_A + 8x_B ≥ 32\n     x_A + x_B ≤ 7\n     x_A,x_B ∈ ℤ≥₀\n<\/code><\/pre>\n<p>คำตอบจาก SciPy:<\/p>\n<ul>\n<li><code>x_A=4<\/code>, <code>x_B=2<\/code>, cost <code>34<\/code><\/li>\n<li>computing <code>8(4)+5(2)=42 ≥ 40<\/code><\/li>\n<li>memory <code>4(4)+8(2)=32<\/code><\/li>\n<li>ใช้ 6 สล็อต <code>≤ 7<\/code><\/li>\n<\/ul>"}, {"id": "n28", "label": "F2. แบ่ง workload 18 หน่วยให้ 3 servers — MILP", "level": 2, "children": [], "body": "<ul>\n<li>capacity: <code>10 / 12 / 8<\/code><\/li>\n<li>fixed cost: <code>14 / 16 / 10<\/code><\/li>\n<li>variable cost ต่อ workload: <code>2 / 1.5 / 2.5<\/code><\/li>\n<li><code>q_j<\/code> = workload แบบ continuous; <code>y_j<\/code> = เปิด/ปิดแบบ binary<\/li>\n<\/ul>\n<pre><code class=\"language-text\">min 14y₀ + 16y₁ + 10y₂ + 2q₀ + 1.5q₁ + 2.5q₂\ns.t. q₀ + q₁ + q₂ = 18\n     q_j ≤ capacity_j · y_j\n<\/code><\/pre>\n<p>คำตอบ:<\/p>\n<ul>\n<li>ปิดเครื่อง 0; เปิดเครื่อง 1 และ 2<\/li>\n<li><code>q₁=12<\/code>, <code>q₂=6<\/code><\/li>\n<li>cost <code>59<\/code><\/li>\n<\/ul>"}, {"id": "n29", "label": "F3. การป้อน scipy.optimize.milp", "level": 2, "children": [], "body": "<p>เรียงตัวแปร:<\/p>\n<pre><code class=\"language-text\">z = [q₀,q₁,q₂,y₀,y₁,y₂]\n<\/code><\/pre>\n<ul>\n<li><code>c = [2,1.5,2.5,14,16,10]<\/code><\/li>\n<li><code>integrality = [0,0,0,1,1,1]<\/code><\/li>\n<li>Bounds: <code>q_j ≤ capacity_j<\/code>, <code>y_j ≤ 1<\/code><\/li>\n<li><code>LinearConstraint(A, lc, uc)<\/code> ใช้รูป <code>l ≤ Az ≤ u<\/code><\/li>\n<li><code>=18<\/code> → lower = upper = 18<\/li>\n<li><code>≤0<\/code> → lower = −∞, upper = 0<\/li>\n<li><code>≥40<\/code> → lower = 40, upper = +∞<\/li>\n<li>อ่าน <code>result.success<\/code>, <code>result.fun<\/code>, <code>result.x<\/code><\/li>\n<li>ค่า integer อาจออกเป็น <code>4.000000001<\/code>; ต้นทางแนะนำ <code>np.rint<\/code><\/li>\n<li>ต้องคำนวณ cost และตรวจ constraint ซ้ำเอง ไม่ควรเชื่อ <code>success<\/code> อย่างเดียว<\/li>\n<\/ul>"}, {"id": "n30", "label": "F4. Task assignment / cache farming — general form", "level": 2, "children": [], "body": "<ul>\n<li>งาน <code>i=1..I<\/code> แบ่งไม่ได้ ต้องไป server <code>j=1..J<\/code> เครื่องเดียว<\/li>\n<li><code>x_ij=1<\/code> ถ้างาน i ไปเครื่อง j<\/li>\n<li><code>y_j=1<\/code> ถ้า server j เปิด<\/li>\n<li>แต่ละงานมี CPU/memory requirement; server มี capacity และ fixed activation energy<\/li>\n<\/ul>\n<pre><code class=\"language-text\">min Σ f_j y_j + ΣΣ e_ij x_ij\ns.t. Σ_j x_ij = 1                         ทุกงาน\n     Σ_i p_i x_ij ≤ P_j y_j               ทุก server j\n     Σ_i m_i x_ij ≤ M_j y_j               ทุก server j\n     x_ij ≤ y_j\n<\/code><\/pre>\n<ul>\n<li>ต้นทางเชื่อมกับ cache farming ในงาน network<\/li>\n<li>ตัวอย่างในสไลด์: เปิด 2 เครื่อง, <code>z* = 50<\/code><\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S7] “MILP ทบทวน + โจทย์ Server (1/2)”; [S8] “โจทย์งานจริง + ODE เปิดตัว (2/2)”, คาบ 30 ส.ค. 2026<\/p>"}, {"id": "n31", "label": "ODE Introduction: โมเดลที่มีเวลาและความจำ", "level": 1, "children": [{"id": "n32", "label": "G1. สัญญาณว่าโจทย์เป็น ODE", "level": 2, "children": [], "body": "<ul>\n<li>มีแกนเวลา<\/li>\n<li>ระบบเปลี่ยนตามเวลา<\/li>\n<li>ค่าปัจจุบันขึ้นกับอดีต<\/li>\n<\/ul>\n<p>ตัวอย่าง: อุณหภูมิ CPU, แบตเตอรี่ที่ชาร์จช้าลงใกล้เต็ม, capacitor/inductor ในวงจร RLC<\/p>"}, {"id": "n33", "label": "G2. Static vs Dynamic", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">Static:  P = VI\nDynamic: C_th · dT/dt = P(t) − (T−T_a)/R_th\n<\/code><\/pre>\n<ul>\n<li>สมการ static บอกความสัมพันธ์ ณ ขณะเดียว<\/li>\n<li>สมการ dynamic อธิบายว่า state วิวัฒน์ตามเวลาอย่างไร<\/li>\n<\/ul>"}, {"id": "n34", "label": "G3. Balance law", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">อัตราสะสม = ไหลเข้า − ไหลออก + กำเนิด − ถูกใช้\n<\/code><\/pre>\n<p>ตัวอย่างถังผสม:<\/p>\n<pre><code class=\"language-text\">dy/dt = 50 − 0.1y\n<\/code><\/pre>"}, {"id": "n35", "label": "G4. ความสัมพันธ์กับ recurrence และ PDE", "level": 2, "children": [], "body": "<ul>\n<li>ระบบ discrete ใช้ recurrence relation เช่น <code>F(n)=F(n−1)+F(n−2)<\/code><\/li>\n<li>ต้นทางระบุรูปคำตอบ <code>α₁r₁ⁿ + α₂r₂ⁿ<\/code> และเปรียบว่าหน้าตาคล้ายคำตอบ ODE <code>C·e^(λt)<\/code><\/li>\n<li>PDE ใช้กับ airflow และ heat transfer บนแผ่นโลหะ; คาบนี้ข้ามหัวข้อนี้<\/li>\n<li>Assumption ตัวอย่าง: สมมติโลหะไม่ละลาย<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [S1] ภาพรวม Dynamic Systems; [S8] ODE เปิดตัว, คาบ 30 ส.ค. 2026<\/p>"}, {"id": "n36", "label": "ประกาศจากอาจารย์", "level": 1, "children": [{"id": "n37", "label": "จากคาบ 23 ส.ค. [S4][S6]", "level": 2, "children": [], "body": "<ul>\n<li>การบ้านกำลังจะออก: โจทย์ modelling อาจให้เขียนโปรแกรมแก้และแปลผล เช่น “อัตราความคุ้มค่า”<\/li>\n<li>ขณะสรุป อาจารย์ยังเขียนโจทย์ไม่เสร็จ ให้รอประกาศ<\/li>\n<li>คาบถัดไป: แปลง MILP เป็นโปรแกรม และแยกเมทริกซ์ฝั่ง continuous/integer<\/li>\n<li>สไลด์ชุดใหม่อัปโหลดแล้ว<\/li>\n<\/ul>"}, {"id": "n38", "label": "จากคาบ 30 ส.ค. [S8]", "level": 2, "children": [], "body": "<ul>\n<li>สัปดาห์ถัดไปงดเรียน เพราะอาจารย์มีภารกิจ<\/li>\n<li>จะชดเชยเพิ่มอีก 1 สัปดาห์ภายหลัง<\/li>\n<li>จะมีการบ้านทบทวนช่วงหยุด ให้ติดตาม Facebook/ช่องทางชั้น<\/li>\n<li>เมื่อกลับมา: จบ ODE, วิธีแก้, <code>solve_ivp<\/code>, และ System of ODE<\/li>\n<li>มีสอบ 1 ครั้ง หลังจบ ODE แล้วจึงกำหนดรายละเอียด<\/li>\n<li>หนังสือแนะนำ: Operational Research สำหรับ modelling และหนังสือที่มีโปรแกรมสำหรับ solve; ต้องใช้ผสมกัน<\/li>\n<li>ข้อความสรุประบุ <strong>Midterm 27 ก.ย.<\/strong><\/li>\n<\/ul>\n<hr />"}], "body": "<p>หมวดนี้มี 2 กิ่งย่อย<\/p>"}, {"id": "n39", "label": "คลังโจทย์ Daily Drill (แยกจากเนื้อหาหลังเรียน)", "level": 1, "children": [], "body": "<p>ไม่มีรายละเอียดเพิ่มในข้อความต้นทาง<\/p>"}, {"id": "n40", "label": "Drill D1 — Summation + Binary 0–1", "level": 1, "children": [{"id": "n41", "label": "ข้อ 1: Summation", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">Σ(i+1), i=1..4\n= (1+1)+(2+1)+(3+1)+(4+1)\n= 2+3+4+5\n= 14\n<\/code><\/pre>"}, {"id": "n42", "label": "ข้อ 2: ค่ากาแฟ 7 วัน", "level": 2, "children": [], "body": "<p>ราคา: <code>45, 50, 45, 55, 50, 60, 45<\/code><\/p>\n<pre><code class=\"language-text\">Σcᵢ, i=1..7 = 350 บาท\n<\/code><\/pre>"}, {"id": "n43", "label": "ข้อ 3: เลือกร้านส่งชา", "level": 2, "children": [], "body": "<ul>\n<li>น้ำหนักร้าน 1/2/3 = <code>2/3/5<\/code> กก.<\/li>\n<li>เลือกได้ไม่เกิน 2 ร้าน<\/li>\n<li>น้ำหนักรวมไม่เกิน 6 กก.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">2x₁ + 3x₂ + 5x₃ ≤ 6\nx₁ + x₂ + x₃ ≤ 2\nx₁,x₂,x₃ ∈ {0,1}\n<\/code><\/pre>\n<p>เฉลยตามต้นทาง:<\/p>\n<ul>\n<li>ร้านเดี่ยว 3 แบบผ่านทั้งหมด<\/li>\n<li>คู่ 1+2 = 5 กก. ผ่าน<\/li>\n<li>คู่ 1+3 = 7 กก. ไม่ผ่าน<\/li>\n<li>คู่ 2+3 = 8 กก. ไม่ผ่าน<\/li>\n<li>รวม 4 แบบ; คู่เดียวที่ผ่านคือร้าน 1+2<\/li>\n<\/ul>"}], "body": "<p><strong>อ้างอิง:<\/strong> [D1], ข้อความ 27 ส.ค. 2026<\/p>"}, {"id": "n44", "label": "Drill D2 — Inequality + Summation + Objective", "level": 1, "children": [{"id": "n45", "label": "ข้อ 1: ค่า BTS", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">32t ≤ 200\n t ≤ 6.25\n<\/code><\/pre>\n<ul>\n<li>ตอบ 6 เที่ยว<\/li>\n<li>6 เที่ยว = 192 บาท เหลือ 8 บาท<\/li>\n<li>7 เที่ยว = 224 บาท เกินงบ<\/li>\n<\/ul>"}, {"id": "n46", "label": "ข้อ 2: ยอดแชร์เท่าตัว 5 วัน", "level": 2, "children": [], "body": "<pre><code class=\"language-text\">Σ2ⁱ, i=0..4\n= 2⁰+2¹+2²+2³+2⁴\n= 1+2+4+8+16\n= 31 ครั้ง\n<\/code><\/pre>"}, {"id": "n47", "label": "ข้อ 3: เลือกสินค้าเข้ากระเป๋า", "level": 2, "children": [], "body": "<ul>\n<li>สติกเกอร์: กำไร 300, หนัก 1 กก.<\/li>\n<li>หมอน: กำไร 500, หนัก 2 กก.<\/li>\n<li>โปสเตอร์: กำไร 400, หนัก 1 กก.<\/li>\n<li>ใส่ไม่เกิน 2 ชิ้น, น้ำหนักไม่เกิน 3 กก.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">1x₁ + 2x₂ + 1x₃ ≤ 3\nx₁ + x₂ + x₃ ≤ 2\nmax 300x₁ + 500x₂ + 400x₃\nx₁,x₂,x₃ ∈ {0,1}\n<\/code><\/pre>\n<p>เฉลย:<\/p>\n<ul>\n<li>หมอน+โปสเตอร์ = 900 บาท, หนัก 3 กก. → ดีที่สุด<\/li>\n<li>หมอน+สติกเกอร์ = 800 บาท<\/li>\n<li>โปสเตอร์+สติกเกอร์ = 700 บาท<\/li>\n<li>ทั้ง 3 ชิ้นกำไร 1,200 บาท แต่น้ำหนัก 4 กก. จึงผิด constraint<\/li>\n<\/ul>\n<hr />"}], "body": "<p><strong>อ้างอิง:<\/strong> [D2], ข้อความ 29 ส.ค. 2026<\/p>"}]}, COURSE="EGCO611";
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),wrap=document.getElementById('mapWrap');
let selected=TREE,zoom=1,query='';const expanded=new Set(['root']);const done=new Set(JSON.parse(localStorage.getItem('mindmap-done-'+COURSE)||'[]'));
const parent=new Map(),byId=new Map();function index(n,p=null){byId.set(n.id,n);if(p)parent.set(n.id,p);(n.children||[]).forEach(c=>index(c,n))}index(TREE);
function visibleChildren(n){return expanded.has(n.id)?(n.children||[]):[]}
function wrapLines(text,max=22){const words=[];for(const token of text.split(/\s+/)){if(token.length<=max)words.push(token);else for(let i=0;i<token.length;i+=max)words.push(token.slice(i,i+max))}const lines=[''];for(const w of words){let i=lines.length-1;if((lines[i]+' '+w).trim().length>max&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim()}return lines}
function prepareNode(n){n._lines=wrapLines(n.label);n._h=Math.max(56,18+n._lines.length*18)}
function layout(){let next=42,maxDepth=0;const rows=[];function walk(n,d){prepareNode(n);maxDepth=Math.max(maxDepth,d);const cs=visibleChildren(n);let center;if(!cs.length){n._y=next;center=n._y+n._h/2;next+=n._h+26}else{const centers=cs.map(c=>walk(c,d+1));center=(centers[0]+centers[centers.length-1])/2;n._y=center-n._h/2}n._x=34+d*248;rows.push(n);return center}walk(TREE,0);return{nodes:rows,width:Math.max(900,80+(maxDepth+1)*248),height:Math.max(650,next+40)}}
function el(name,attrs={}){const x=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))x.setAttribute(k,v);return x}
function render(){const L=layout();svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${L.width} ${L.height}`);svg.style.width=(L.width*zoom)+'px';svg.style.height=(L.height*zoom)+'px';const shown=new Set(L.nodes.map(n=>n.id));L.nodes.forEach(n=>{if(n.id==='root')return;const p=parent.get(n.id);if(!shown.has(p.id))return;const path=el('path',{d:`M ${p._x+190} ${p._y+p._h/2} C ${p._x+220} ${p._y+p._h/2}, ${n._x-30} ${n._y+n._h/2}, ${n._x} ${n._y+n._h/2}`,class:'edge'+((selected.id===n.id||selected.id===p.id)?' active':'')});svg.appendChild(path)});L.nodes.forEach(n=>{const g=el('g',{class:'node '+(n.id==='root'?'root ':'')+((n.children||[]).length?'branch ':'')+(selected.id===n.id?'selected ':'')+(done.has(n.id)?'done ':'')+(query&&nodeText(n).includes(query)?'match ':'') ,transform:`translate(${n._x},${n._y})`,'data-id':n.id,tabindex:'0',role:'button','aria-label':n.label});g.appendChild(el('rect',{width:190,height:n._h,rx:4}));const lines=n._lines;lines.forEach((line,i)=>{const t=el('text',{x:12,y:22+i*18});t.textContent=line;g.appendChild(t)});if((n.children||[]).length){const t=el('text',{x:174,y:n._h/2+5,class:'small','text-anchor':'middle'});t.textContent=expanded.has(n.id)?'−':'+';g.appendChild(t)}if(done.has(n.id)){const c=el('circle',{cx:181,cy:8,r:5,class:'status'});g.appendChild(c)}g.addEventListener('click',()=>choose(n,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n,true)}});svg.appendChild(g)});document.getElementById('visibleCount').textContent=L.nodes.length+' กิ่งที่แสดง'}
function nodeText(n){return(n.label+' '+strip(n.body)).toLowerCase()}function strip(x){const d=document.createElement('div');d.innerHTML=x;return d.textContent||''}
function pathOf(n){const a=[n.label];while(parent.has(n.id)){n=parent.get(n.id);a.unshift(n.label)}return a.join(' › ')}
function choose(n,toggle){selected=n;if(toggle&&(n.children||[]).length){expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id)}document.getElementById('crumb').textContent=pathOf(n);document.getElementById('detailTitle').textContent=n.label;document.getElementById('detail').innerHTML=n.body;document.getElementById('doneBtn').textContent=done.has(n.id)?'อ่านแล้ว ✓':'ทำเครื่องหมายว่าอ่านแล้ว';render()}
function setAll(open){byId.forEach(n=>{if((n.children||[]).length){open?expanded.add(n.id):expanded.delete(n.id)}});expanded.add('root');render()}
document.getElementById('expand').onclick=()=>setAll(true);document.getElementById('collapse').onclick=()=>setAll(false);document.getElementById('zin').onclick=()=>{zoom=Math.min(1.8,zoom+.15);render()};document.getElementById('zout').onclick=()=>{zoom=Math.max(.55,zoom-.15);render()};document.getElementById('reset').onclick=()=>{zoom=1;wrap.scrollTo(0,0);render()};document.getElementById('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('mindmap-theme',n)};const th=localStorage.getItem('mindmap-theme');if(th)document.documentElement.dataset.theme=th;
document.getElementById('doneBtn').onclick=()=>{done.has(selected.id)?done.delete(selected.id):done.add(selected.id);localStorage.setItem('mindmap-done-'+COURSE,JSON.stringify([...done]));choose(selected,false)};
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();if(query){byId.forEach(n=>{if(nodeText(n).includes(query)){let x=n;while(parent.has(x.id)){x=parent.get(x.id);expanded.add(x.id)}}})}render();const hits=[...byId.values()].filter(n=>query&&nodeText(n).includes(query));document.getElementById('searchStatus').textContent=query?hits.length+' จุดที่พบ':''});
let drag=false,sx=0,sy=0,sl=0,st=0;wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag=true;sx=e.clientX;sy=e.clientY;sl=wrap.scrollLeft;st=wrap.scrollTop;wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(drag){wrap.scrollLeft=sl-(e.clientX-sx);wrap.scrollTop=st-(e.clientY-sy)}});wrap.addEventListener('pointerup',()=>{drag=false;wrap.classList.remove('dragging')});
choose(TREE,false);
</script></body></html>
